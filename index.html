<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Calisthenics</title>
<meta name="theme-color" content="#E8ECF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calisthenics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232450FF'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='15' stroke-linecap='round'%3E%3Cpath d='M110 56 A34 34 0 1 0 110 124'/%3E%3Cpath d='M82 90 H139'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 40'%3E%3Cg fill='none' stroke='%232450FF' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M30.3 11.3 A13.5 13.5 0 1 0 30.3 28.7'/%3E%3Cpath d='M19 20 H40'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --paper:#E8ECF1; --card:#FFFFFF; --ink:#0E1116; --ink-2:#39414D;
  --muted:#6B7684; --faint:#9AA4B2; --line:#DFE5EC;
  --blue:#2450FF; --blue-ink:#1638C7; --blue-wash:#EBEFFF;
  --orange:#FF5F2E; --green:#0E9F6E; --green-wash:#E6F6F0;
  --amber-wash:#FFF3DF; --red:#DC3A2B; --red-wash:#FFECEA;
  --disp:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh-1:0 1px 2px rgba(14,17,22,.05);
  --sh-2:0 2px 4px rgba(14,17,22,.04),0 10px 26px -10px rgba(14,17,22,.14);
  --sh-3:0 8px 16px rgba(14,17,22,.08),0 30px 60px -20px rgba(14,17,22,.26);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --ease:cubic-bezier(.22,.8,.28,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}

.hdr{padding:calc(env(safe-area-inset-top) + 18px) 18px 4px;max-width:620px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:20px;}
.brand svg{width:26px;height:24px;flex-shrink:0;}
.brand svg path{stroke:var(--blue);stroke-width:5;fill:none;stroke-linecap:round;}
.brand-w{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);}
.brand-d{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 0 4px var(--blue-wash);}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
.h1{font-family:var(--disp);font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:5px;}
.sub{color:var(--muted);font-size:13.5px;margin-top:7px;max-width:44ch;}

.eyerow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.calbtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:6px 12px 6px 10px;font-size:12px;font-weight:600;color:var(--ink-2);
  cursor:pointer;box-shadow:var(--sh-1);transition:transform .16s var(--ease);}
.calbtn:active{transform:scale(.94);}
.calbtn svg{width:13px;height:13px;stroke:var(--blue);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px;flex-shrink:0;}
.cal-m{font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.03em;}
.cal-nav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  transition:transform .16s var(--ease);box-shadow:var(--sh-1);}
.cal-nav:active{transform:scale(.9);}
.cal-nav svg{width:16px;height:16px;stroke:var(--ink-2);stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-h{text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--faint);
  text-transform:uppercase;padding-bottom:6px;}
.cal-d{aspect-ratio:1;border-radius:12px;background:var(--card);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:var(--sh-1);
  font-family:var(--disp);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  transition:transform .14s var(--ease),background .18s;}
.cal-d:active{transform:scale(.9);}
.cal-d.fut{color:var(--faint);}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue);}
.cal-d.sel{background:var(--ink);color:#fff;box-shadow:none;}
.cal-dots{display:flex;gap:3px;height:5px;align-items:center;}
.cd{width:5px;height:5px;border-radius:50%;display:inline-block;}
.cd.log{background:var(--blue);} .cd.plan{background:#CBD3DC;} .cd.wt{background:var(--green);}
.cal-d.sel .cd.log{background:#fff;} .cal-d.sel .cd.plan{background:rgba(255,255,255,.4);}
.cal-key{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:11.5px;color:var(--muted);}
.cal-key span{display:flex;align-items:center;gap:5px;}
.rail{display:flex;gap:6px;margin:16px 0 4px;}
.rday{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 2px 7px;text-align:center;cursor:pointer;
  transition:transform .18s var(--ease),background .2s,border-color .2s;}
.rday:active{transform:scale(.93);}
.rday.on{background:var(--ink);border-color:var(--ink);}
.rday.now:not(.on){border-color:var(--blue);}
.rday-l{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;}
.rday.on .rday-l{color:rgba(255,255,255,.62);}
.rday.now:not(.on) .rday-l{color:var(--blue);}
.rday-d{width:5px;height:5px;border-radius:50%;background:var(--line);margin:5px auto 0;}
.rday-d.done{background:var(--blue);}
.rday.on .rday-d{background:rgba(255,255,255,.28);}
.rday.on .rday-d.done{background:#fff;}

.wrap{max-width:620px;margin:0 auto;padding:8px 18px 28px;}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.lbl button{background:none;border:none;color:var(--blue);font-size:11px;font-weight:600;
  letter-spacing:.04em;text-transform:none;cursor:pointer;padding:0;}

.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-2);margin-bottom:12px;
  overflow:hidden;animation:rise .32s var(--ease) both;}
@keyframes rise{from{opacity:0;transform:translateY(9px);}}
.pad{padding:16px 18px;}
.ex-top{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:11px;}
.gly{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3.3;
  stroke-linecap:round;stroke-linejoin:round;display:block;overflow:visible;}
.gly .env{stroke-width:2.3;opacity:.32;}
.ex-gly{width:44px;height:44px;flex-shrink:0;border-radius:13px;background:var(--blue-wash);
  color:var(--blue);padding:5px;margin-top:1px;}
.pick-g{width:38px;height:38px;flex-shrink:0;border-radius:11px;background:var(--paper);
  color:var(--ink-2);padding:4px;}
.pick.in .pick-g{background:rgba(255,255,255,.2);color:#fff;}
.eline-g{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--blue-wash);
  color:var(--blue);padding:4px;}
.inf-top{display:flex;align-items:center;gap:14px;padding:6px 2px 4px;}
.inf-gly{width:76px;height:76px;flex-shrink:0;border-radius:22px;background:var(--blue);
  color:#fff;padding:10px;box-shadow:var(--sh-2);}
.inf-n{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15;}
.inf-t{font-size:12.5px;color:var(--muted);margin-top:3px;}
.inf-list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);overflow:hidden;}
.inf-list li{padding:13px 17px 13px 42px;font-size:13.5px;line-height:1.5;color:var(--ink-2);
  border-bottom:1px solid var(--line);position:relative;}
.inf-list li:last-child{border-bottom:none;}
.inf-list li::before{content:"";position:absolute;left:19px;top:20px;width:7px;height:7px;
  border-radius:50%;background:var(--blue);}
.inf-warn{background:#FFF1EC;border-radius:var(--r-lg);padding:15px 17px;font-size:13.5px;
  line-height:1.5;color:#9A3B1C;}

.ex-name{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.chip{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:500;color:var(--muted);
  background:var(--paper);padding:3px 9px;border-radius:99px;}
.ex-tools{display:flex;gap:4px;margin-left:auto;flex-shrink:0;}
.icb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  transition:transform .16s var(--ease),background .16s;}
.icb:active{transform:scale(.87);background:var(--paper);}
.icb svg{width:13px;height:13px;stroke:var(--muted);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.icb.dngr svg{stroke:var(--red);}

.sets{padding:0 18px 16px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.set{background:var(--paper);border-radius:11px;padding:7px 10px;display:flex;align-items:center;gap:5px;
  animation:pop .2s var(--ease) both;}
@keyframes pop{from{opacity:0;transform:scale(.86);}}
.set input{background:none;border:none;width:38px;text-align:right;padding:0;outline:none;
  font-family:var(--disp);font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.set input::placeholder{color:var(--faint);font-weight:400;}
.set .u{font-size:11px;color:var(--muted);font-weight:500;}
.stp{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:16px;font-weight:600;line-height:1;padding:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .14s var(--ease),background .14s,color .14s;}
.stp:active{transform:scale(.86);background:var(--blue);color:#fff;border-color:var(--blue);}
.set .rm{color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 1px 2px 3px;}
.ghost-btn{background:none;border:1.5px dashed var(--line);border-radius:11px;padding:8px 14px;
  color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s var(--ease);}
.ghost-btn:active{transform:scale(.95);border-color:var(--blue);color:var(--blue);}
.time-btn{background:var(--blue-wash);border:none;border-radius:11px;padding:8px 13px;color:var(--blue-ink);
  font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:transform .16s var(--ease);}
.time-btn:active{transform:scale(.95);}
.time-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;}

.meter{padding:0 18px 18px;}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;}
.meter-v{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-.02em;}
.meter-g{font-size:11.5px;color:var(--faint);font-weight:500;text-align:right;}
.track{height:7px;background:var(--paper);border-radius:99px;overflow:hidden;}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4E77FF,var(--blue));
  transition:width .7s var(--ease);}
.fill.done{background:linear-gradient(90deg,#28C08A,var(--green));}
.meter-msg{font-size:12px;color:var(--green);margin-top:8px;font-weight:500;line-height:1.4;}

.cta{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--r-md);padding:16px;
  font-size:15.5px;font-weight:600;letter-spacing:-.01em;cursor:pointer;box-shadow:var(--sh-2);
  transition:transform .16s var(--ease),box-shadow .16s;}
.cta:active{transform:scale(.975);box-shadow:var(--sh-1);}
.cta.blue{background:var(--blue);}
.cta.soft{background:var(--card);color:var(--ink-2);box-shadow:var(--sh-1);}
.cta.wide-dash{background:none;box-shadow:none;border:1.5px dashed var(--line);color:var(--muted);}
.cta.wide-dash:active{border-color:var(--blue);color:var(--blue);}
.cta.sm{padding:12px;font-size:14px;}
.row{display:flex;gap:9px;} .row .cta{width:auto;flex:1;}

.banner{display:flex;align-items:center;gap:12px;background:var(--blue-wash);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:12px;font-size:13px;color:var(--blue-ink);line-height:1.4;
  animation:rise .3s var(--ease) both;}
.banner b{font-weight:600;}
.banner button{margin-left:auto;flex-shrink:0;background:var(--blue);color:#fff;border:none;
  border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;
  transition:transform .16s var(--ease);}
.banner button:active{transform:scale(.94);}

.wt{display:flex;align-items:center;gap:12px;}
.wt input{flex:1;min-width:0;background:none;border:none;outline:none;padding:0;
  font-family:var(--disp);font-size:38px;font-weight:800;letter-spacing:-.04em;color:var(--ink);
  font-variant-numeric:tabular-nums;}
.wt input::placeholder{color:#C9D1DB;}
.wt .kg{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--faint);}
.wt-btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:12px 18px;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .16s var(--ease);flex-shrink:0;}
.wt-btn:active{transform:scale(.94);}
.food{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px;}
.macs{display:flex;gap:0;}
.mac{flex:1;padding-right:12px;border-right:1px solid var(--line);}
.mac:last-child{border-right:none;padding-right:0;padding-left:12px;}
.mac:nth-child(2){padding-left:12px;}
.mac-l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);}
.mac-v{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.03em;margin-top:3px;
  display:flex;align-items:baseline;gap:2px;}
.mac-v .u{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:0;}
.mac-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:4px;align-self:center;}
.mac-dot.ok{background:var(--green);}
.mac-dot.low{background:var(--orange);}
.mac-dot.high{background:var(--orange);}
.mac-t{font-size:11.5px;color:var(--muted);margin-top:1px;}
.food-f{flex:1;min-width:0;display:flex;align-items:baseline;gap:5px;}
.food-f input{width:100%;min-width:0;background:none;border:none;outline:none;padding:0;
  font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;}
.food-f input::placeholder{color:#C9D1DB;}
.food-u{font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap;}
.wt-note{font-size:12px;color:var(--faint);margin-top:10px;padding-top:12px;border-top:1px solid var(--line);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.stat{background:var(--card);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--sh-2);}
.stat-k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);}
.stat-v{font-family:var(--disp);font-size:29px;font-weight:800;letter-spacing:-.035em;margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.05;}
.stat-v .u{font-size:14px;font-weight:600;color:var(--faint);letter-spacing:0;}
.stat-s{font-size:12px;color:var(--muted);margin-top:2px;}

.note{border-radius:var(--r-lg);padding:15px 17px;margin-bottom:12px;font-size:13.5px;line-height:1.5;
  animation:rise .32s var(--ease) both;}
.note-k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:5px;}
.note.ok{background:var(--green-wash);color:#0A6A4A;}
.note.warn{background:var(--amber-wash);color:#8A5400;}
.note.bad{background:var(--red-wash);color:#A22A1D;}

.chart svg{display:block;width:100%;overflow:visible;}
.legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center;}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px;}

/* plan maker */
.dcard{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-2);margin-bottom:10px;
  overflow:hidden;animation:rise .3s var(--ease) both;}
.dhead{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer;}
.dhead:active{background:var(--paper);}
.ddow{font-family:var(--disp);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue);width:34px;flex-shrink:0;}
.dinfo{flex:1;min-width:0;}
.dname{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.02em;}
.dmeta{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dcar{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:transform .28s var(--ease);}
.dcar.open{transform:rotate(180deg);}
.dcar svg{width:13px;height:13px;stroke:var(--faint);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.dbody{padding:0 17px 16px;border-top:1px solid var(--line);animation:rise .26s var(--ease) both;}
.dbody .lbl{margin:16px 0 9px;}
.eline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.eline:last-of-type{border-bottom:none;}
.eline-n{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.01em;}
.eline-t{font-size:11.5px;color:var(--faint);font-weight:400;margin-top:1px;}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--blue-wash);color:var(--blue-ink);
  border-radius:99px;padding:3px 9px;font-size:11px;font-weight:600;}

.rule{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  color:var(--ink-2);line-height:1.5;}
.rule:last-child{border-bottom:none;}
.rule i{font-style:normal;color:var(--blue);font-weight:600;font-size:12px;flex-shrink:0;padding-top:2px;
  font-variant-numeric:tabular-nums;}
.prose{font-size:13.5px;color:var(--ink-2);line-height:1.6;}
.prose b{color:var(--ink);font-weight:600;}

.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);}
.hrow:last-child{border-bottom:none;}
.hname{font-size:14px;font-weight:600;}
.hdate{font-size:12px;color:var(--faint);margin-top:1px;}
.hval{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  padding:0 14px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none;}
.nav-in{display:flex;gap:2px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);border-radius:99px;padding:5px;box-shadow:var(--sh-3);
  pointer-events:auto;border:1px solid rgba(255,255,255,.7);max-width:100%;}
.nb{border:none;background:none;border-radius:99px;padding:11px 14px;cursor:pointer;display:flex;
  align-items:center;gap:0;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  transition:color .2s var(--ease),background .3s var(--ease),padding .3s var(--ease);}
.nb svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.nb span{max-width:0;overflow:hidden;transition:max-width .32s var(--ease),margin .32s var(--ease);}
.nb.on{background:var(--ink);color:#fff;padding:11px 17px;}
.nb.on span{max-width:90px;margin-left:8px;}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(14,17,22,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease both;}
@keyframes fade{from{opacity:0;}}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;
  border-radius:26px 26px 0 0;animation:up .32s var(--ease) both;box-shadow:var(--sh-3);}
@keyframes up{from{transform:translateY(100%);}}
.grab{width:38px;height:4px;background:#CBD3DC;border-radius:99px;margin:10px auto 4px;flex-shrink:0;}
.sh-head{padding:8px 16px 14px;flex-shrink:0;}
.sh-title{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px;}
.sh-title span{color:var(--muted);font-weight:400;}
.sh-in{display:flex;gap:9px;align-items:center;}
.sh-in input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:16px;font-family:var(--body);outline:none;color:var(--ink);}
.sh-in input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash);}
.sh-done{background:var(--ink);color:#fff;border:none;border-radius:12px;padding:12px 16px;
  font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;}
.sh-body{overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.cat{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px;}
.pick{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px 15px;
  margin-bottom:7px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .16s var(--ease);}
.pick:active{transform:scale(.98);}
.pick-n{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
.pick-t{font-size:12px;color:var(--muted);margin-top:1px;}
.pick-b{margin-left:auto;width:27px;height:27px;border-radius:99px;background:var(--paper);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
.pick-b svg{width:13px;height:13px;stroke:var(--muted);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.pick.in{background:var(--blue);}
.pick.in .pick-n{color:#fff;} .pick.in .pick-t{color:rgba(255,255,255,.72);}
.pick.in .pick-b{background:rgba(255,255,255,.22);}
.pick.in .pick-b svg{stroke:#fff;}

.dial-ex{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.02em;}
.dial-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

.dial svg{transform:rotate(-90deg);display:block;}

.dial-arc{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .18s linear,stroke .3s;}

.dial-u{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px;}

.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;margin:0 auto 16px;

.seg button{border:none;background:none;border-radius:99px;padding:8px 20px;font-size:13.5px;font-weight:600;

.seg button.on{background:var(--ink);color:#fff;}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

  padding:15px 17px;border-left:4px solid var(--blue);animation:rise .32s var(--ease) both;}
.sug-steady,.sug-form{border-left-color:var(--orange);}
.sug-step{border-left-color:var(--green);}
.sug-ex{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.sug-h{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:4px;}
.sug-b{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:6px;}
.sug-btn{margin-top:12px;width:100%;background:var(--blue-wash);color:var(--blue-ink);border:none;
  border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .16s var(--ease);}
.sug-btn:active{transform:scale(.97);}
.wk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
.wk-lab{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.02em;}
.wk-sub{font-size:12px;color:var(--faint);}
.wk-row{font-size:13.5px;color:var(--ink-2);}
.wk-row b{color:var(--ink);font-weight:600;}
.wk-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.empty{text-align:center;padding:32px 22px;color:var(--faint);font-size:13.5px;line-height:1.6;}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);

  z-index:80;box-shadow:var(--sh-3);animation:tin .26s var(--ease) both;max-width:88vw;text-align:center;}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px) scale(.94);}}
select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);

  background-repeat:no-repeat;background-position:right 16px center;}
select.mini{padding:11px 13px;font-size:14px;font-weight:600;border-radius:12px;box-shadow:none;

textarea#sum{height:150px;}
textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;

:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ============ form notes ============ */
/* f: what to focus on   w: the fault that shows up most */
var FORM={
 lean:{f:["Hands turned out 45\u201390\u00b0, elbows locked and pointing back.","Protract hard \u2014 push the floor away so the upper back rounds slightly.","Lean until your shoulders sit clearly past your wrists, then hold there.","Squeeze glutes so the hips do not sag behind you."],w:"Bending the elbows to buy depth. That turns it into a push-up hold and stops training the lever."},
 tuckP:{f:["Knees tucked tight to the chest, hips at shoulder height.","Full protraction and posterior pelvic tilt \u2014 round the lower back deliberately.","Elbows locked, biceps facing forward.","Eyes down at the floor, not forward."],w:"Piking the hips above the shoulders. It makes the hold easier and stops the progression working."},
 advP:{f:["One knee out toward straight, the other tucked.","Hips level with shoulders, back flat.","Same protraction as the tuck \u2014 do not lose it as the lever gets longer."],w:"Letting the hips drop as the leg extends. Shorten the leg rather than break the line."},
 strP:{f:["Legs wide and straight, toes pointed.","Body in one line from head to feet.","Push the ground away throughout \u2014 no shrugging."],w:"Piking at the hip. Widen the straddle instead of lifting the hips."},
 tuckFL:{f:["Arms dead straight, actively pulling the bar toward your hips.","Depress and retract the scapulae \u2014 chest toward the bar.","Knees to chest, hips at shoulder height, back flat against an imaginary wall."],w:"Bent elbows. Straight arms are the whole point; drop to an easier tuck rather than bend."},
 advFL:{f:["One leg extended, other knee tucked.","Keep the ribs down and the pelvis tucked under.","Straight-arm pull maintained the entire hold."],w:"Arching the lower back once the leg extends. Reset the pelvic tilt."},
 strFL:{f:["Legs straight and wide, body horizontal.","Scapulae retracted and depressed the whole time.","Push the bar down toward your feet, do not pull it toward your chest."],w:"Hips dropping below shoulder height. Stop the set when the line breaks."},
 fullFL:{f:["Legs together, whole body one horizontal line.","Full straight-arm engagement from the lats.","Breathe shallow \u2014 do not lose the hollow."],w:"Holding the breath and losing the ribs-down position halfway through."},
 flNeg:{f:["Start in an inverted hang, lower with straight arms.","Control the whole way \u2014 five seconds is a good target.","Stop the rep the moment your elbows bend."],w:"Dropping through the last third. That part is where the strength is built."},
 flPull:{f:["From a hang, pull to the front lever position with straight arms.","Drive with the lats and the scapulae, not the biceps.","Only add these once you own a solid straddle hold."],w:"Turning it into a bent-arm pull-up when it gets hard."},
 tuckBL:{f:["From an inverted hang, rotate slowly through the shoulders.","Keep arms straight and knees tucked.","Go only as far as your shoulders allow \u2014 back off at any pinching."],w:"Rushing the rotation. Back lever is the position most likely to hurt a shoulder or a biceps tendon."},
 strBL:{f:["Legs wide, body face-down and horizontal.","Arms straight, shoulders externally rotated where possible.","Build up in five-second increments, not big jumps."],w:"Extending too fast for the biceps tendon to keep up."},
 germanH:{f:["Hang inverted with straight arms behind you.","Let gravity open the shoulder gradually \u2014 do not force it.","Breathe out into the stretch."],w:"Loading it cold. Warm the shoulders first."},
 bandPull:{f:["Arms locked, drive the band down in an arc to the thighs.","Initiate from the lat, not the triceps.","Slow on the way back up."],w:"Bending the elbows, which makes it a triceps exercise instead of straight-arm work."},

 pppu:{f:["Hands at hip level, fingers turned out.","Lean forward so the shoulders travel past the hands.","Elbows stay close, protract at the top."],w:"Letting the hips lead. Keep the body one line and lean from the shoulders."},
 hspu:{f:["Hands slightly wider than shoulders, a hand's length from the wall.","Lower until the head lightly touches the floor, not into it.","Ribs down \u2014 do not arch to get depth."],w:"Flaring the elbows wide, which puts the shoulder in its weakest position."},
 hspuDef:{f:["Hands on parallettes or blocks for extra range.","Lower under control until the shoulders pass the hands.","Only add deficit once flat-ground reps are clean."],w:"Adding depth before you own the range. Depth exposes shoulder mobility fast."},
 freeHSPU:{f:["Find the balance first, then bend.","Small deliberate range at the start.","Keep the whole body tight \u2014 a loose midsection makes balancing impossible."],w:"Chasing depth before balance. Bail sideways rather than collapse."},
 pike:{f:["Hips high, head between the arms.","Elbows track back at about 45\u00b0.","Elevate the feet to make it harder."],w:"Letting the hips drop, turning it into a decline push-up."},
 ringSup:{f:["Arms locked, rings pressed into the sides.","Shoulders depressed \u2014 push down away from your ears.","Hollow body, glutes on."],w:"Shrugging up into the rings, which teaches exactly the wrong shoulder position."},
 rto:{f:["Turn the rings out until the thumbs point forward.","Keep the arms locked and the shoulders down.","Build in ten-second pieces."],w:"Turning out only at the wrist. The rotation comes from the shoulder."},
 latRaise:{f:["Slight forward lean, thumbs level or slightly down.","Lead with the elbow, stop at shoulder height.","Light weight, slow lowering."],w:"Swinging the weight up with the traps."},
 ohp:{f:["Bar starts on the front delts, elbows just in front of the bar.","Push the head through once the bar clears.","Squeeze glutes to stop the lower back arching."],w:"Leaning back to press. If you need lean, the weight is too heavy."},

 wdips:{f:["Lean the torso forward about 30\u00b0 to bias the chest.","Lower until the shoulders are level with the elbows, no deeper.","Belt the weight, keep it from swinging."],w:"Going too deep. Below parallel puts the shoulder capsule under load it does not need."},
 dips:{f:["Forward lean for chest, upright for triceps.","Control the descent, no bouncing out of the bottom.","Full lockout at the top without shrugging."],w:"Dropping fast and rebounding. That is where shoulder injuries come from."},
 ringDip:{f:["Rings stable at the bottom \u2014 fight the wobble rather than rushing.","Turn out at the top if you can.","Shallower range than bar dips while you learn."],w:"Letting the rings drift apart at the bottom."},
 ringPU:{f:["Rings just off the floor, body one straight line.","Elbows tuck to about 45\u00b0, turn the rings out at lockout.","Protract at the top."],w:"Hips sagging. Squeeze the glutes and brace the midsection."},
 archer:{f:["One arm bends and takes the load, the other stays straight out to the side.","Keep the hips square to the floor.","Alternate sides evenly."],w:"Rotating the hips to cheat the load onto the straight arm."},
 defPU:{f:["Hands on blocks so the chest can pass below them.","Full range under control.","Keep elbows at 45\u00b0, not flared."],w:"Losing the plank line as the range increases."},
 declPU:{f:["Feet elevated, body one line from head to heels.","More elevation means more shoulder involvement.","Hands slightly wider than shoulders."],w:"Piking at the hips to take the load off."},
 pushup:{f:["Body one line, hands under the shoulders.","Elbows at 45\u00b0, chest to the floor.","Push all the way through to protraction."],w:"Half reps. Chest to the floor or it does not count."},
 ringFly:{f:["Arms almost straight, open only as far as you control.","Small range at first \u2014 this is a strong stretch position.","Squeeze the chest to bring the rings together."],w:"Going too wide too soon and straining the shoulder or biceps."},
 oapu:{f:["Elevate the hands to regress, lower them as you get stronger.","Feet wide for balance, hips square.","Free hand behind the back once you can."],w:"Twisting the torso. If it twists, the surface is still too low."},
 bench:{f:["Shoulder blades pinned back and down.","Bar to the lower chest, elbows around 45\u00b0.","Feet planted, no bouncing off the ribs."],w:"Letting the shoulders roll forward at the bottom."},

 wpull:{f:["Dead hang start, full lockout at the bottom of every rep.","Pull the chest toward the bar, elbows down and back.","Belt or dip belt for the load, no swinging."],w:"Shortening the range as the weight climbs. Half reps do not carry over."},
 pullups:{f:["Full dead hang, chin clearly over the bar.","Initiate with the scapulae before the arms.","No kip \u2014 these are strict."],w:"Starting the pull with bent arms from a shortened hang."},
 sternum:{f:["Pull high enough that your sternum meets the bar.","Lean back slightly, drive the elbows down.","Three clean reps beat six sloppy ones."],w:"Kipping to get the extra height. The whole point is strict range."},
 muNeg:{f:["Start above the bar in the support position.","Lower slowly through the transition \u2014 that is the part you are training.","Five seconds or more per rep."],w:"Dropping through the transition, which is exactly the section you need."},
 mu:{f:["Fast pull to sternum height, then a decisive transition.","Keep the bar close through the turnover.","Finish with a full lockout."],w:"Relying on the kip. If you cannot do it strict, keep working the negatives."},
 rows:{f:["Torso braced, pull to the lower ribs.","Squeeze the shoulder blades at the top.","Control the return, no jerking."],w:"Using the lower back to swing the weight up."},
 ringRow:{f:["Body straight, heels on the floor.","Pull the rings to the ribs, turn out at the top.","Lower the rings to make it harder."],w:"Hips sagging so the row becomes a partial."},
 oapull:{f:["Use a band or a towel for the assisting arm.","Keep the shoulder packed \u2014 do not let it ride up.","Work both sides evenly."],w:"Twisting the torso hard to compensate. Assist more instead."},
 scapPull:{f:["Hang straight, arms locked.","Pull the shoulders down and back without bending the elbows.","Small range, deliberate."],w:"Turning it into a partial pull-up."},
 curls:{f:["Elbows fixed at the sides.","Full range, controlled lowering.","Light enough to stop swinging."],w:"Swinging from the hips to move heavier weight."},

 handstand:{f:["Stack wrists, shoulders and hips over each other.","Push tall through the shoulders \u2014 do not sink.","Fingertips do the balancing, not the whole hand."],w:"Arching the lower back to find balance instead of stacking."},
 handstandLong:{f:["Practise while fresh, before anything tiring.","Short frequent attempts beat long grinding sets.","Learn a reliable bail before chasing time."],w:"Practising tired, which just grooves a bad shape."},
 hsHold:{f:["Balance from the fingers and small wrist adjustments.","Ribs down, glutes on, one straight line.","Eyes on the floor between the hands."],w:"Holding the breath. Breathe shallow and steady."},
 wallHS:{f:["Chest to wall is better than back to wall for shape.","Push tall, squeeze the legs together.","Come down before the shape breaks."],w:"Back-to-wall banana shape, which teaches the arch you will have to unlearn."},
 wristPrep:{f:["Five minutes before any hand-loaded work, every session.","Cover flexion, extension and rotation.","Build gradually \u2014 this is what keeps you training."],w:"Skipping it. Wrists are the most common thing to stop planche progress."},

 lsit:{f:["Press the floor away, shoulders depressed.","Legs straight, toes pointed, thighs lifted actively.","Posterior pelvic tilt \u2014 do not lean back."],w:"Shrugging and leaning back to get the legs up."},
 vsit:{f:["From an L-sit, lift the legs past horizontal.","Lean the shoulders slightly back over the hands.","Compression strength is the limiter \u2014 train pike compression separately."],w:"Bending the knees to get height."},
 hollow:{f:["Lower back pressed flat into the floor.","Ribs down, arms by the ears if you can hold the position.","Raise the arms or legs to regress."],w:"Letting the lower back arch off the floor, which removes the whole point."},
 dragonFlag:{f:["Anchor at the shoulders, not the neck.","Body one rigid line lowering slowly.","Tuck the knees to regress."],w:"Piking at the hips halfway down."},
 toesBar:{f:["Control the swing before adding reps.","Compress from the abs, not momentum.","Lower with control rather than dropping."],w:"Swinging into every rep."},
 abWheel:{f:["Start from the knees, ribs down throughout.","Only roll as far as you can keep the back flat.","Pull back with the abs, not the arms."],w:"Arching the lower back at full extension."},
 plank:{f:["Elbows under shoulders, body one line.","Squeeze glutes, tuck the pelvis slightly.","Quality over duration."],w:"Sagging hips, which loads the lower back instead of the abs."},

 squat:{f:["Brace hard before you unrack, breath held at the top of each rep.","Knees track over the toes, whole foot planted.","Hit consistent depth every rep \u2014 at least parallel."],w:"Letting the chest drop out of the bottom. Brace harder or drop the weight."},
 frontSq:{f:["Elbows high, bar resting on the front delts.","Stay upright, knees forward.","Depth comes from ankle and hip mobility."],w:"Elbows dropping, which dumps the bar forward."},
 rdl:{f:["Push the hips back, bar stays against the legs.","Slight knee bend, back flat throughout.","Stop when the hamstrings run out of range."],w:"Turning it into a squat by bending the knees. It is a hinge."},
 bss:{f:["Rear foot elevated, most of the load on the front leg.","Torso slightly forward for glutes, upright for quads.","Front shin roughly vertical at the bottom."],w:"Pushing off the back foot, which turns it into a weak split squat."},
 nordic:{f:["Anchor the heels, lower as slowly as you can.","Hands ready to catch you.","Push back up with the hands if needed."],w:"Piking at the hips to shorten the lever."},
 calf:{f:["Full range \u2014 deep stretch at the bottom, full extension at the top.","Pause a beat at the top.","Slow tempo beats heavy weight."],w:"Bouncing through short reps."},
 pistol:{f:["Sit back and down, other leg straight ahead.","Hold a counterweight to help balance.","Heel stays down."],w:"Collapsing at the bottom rather than controlling the descent."},
 lunge:{f:["Long strides, torso upright.","Back knee tracks toward the floor.","Front shin close to vertical."],w:"Short steps, which loads the knee instead of the hip."},
 hipThrust:{f:["Bar over the hips, shoulders on a bench.","Drive through the heels, full lockout at the top.","Chin tucked, ribs down."],w:"Hyperextending the lower back at the top instead of finishing with the glutes."},

 invDL:{f:["From an inverted hang, hinge at the hips and let the legs lower while the torso stays put.","Arms locked, actively pull the bar toward your hips the whole time.","Squeeze the glutes hard at the top of each rep.","Keep the rings or bar close to your shins."],w:"Bending the elbows to control the descent, which removes the straight-arm work that transfers to the front lever."},
 invHang:{f:["Hips directly above the shoulders, body in one line.","Shoulders pulled down away from the ears.","Toes pointed, glutes squeezed \u2014 no banana shape."],w:"Hanging passively with the shoulders shrugged. Actively pull down or you are only training grip."},
 skinCat:{f:["Rotate slowly through the shoulders, knees tucked at first.","Go only as far as the shoulders allow, then return under control.","Excellent as a warm-up before any lever work."],w:"Dropping into the bottom position. The shoulder does not like being loaded at end range unexpectedly."},
 tuckFLpull:{f:["Hold a tuck front lever, then pull the bar to your chest without dropping the hips.","Elbows drive down and back, body stays horizontal.","Lower under control back to the lever line."],w:"Letting the hips sink as you pull, which turns it into a regular pull-up."},
 advFLpull:{f:["One knee extended, hips level with shoulders throughout.","Break parallel \u2014 elbows must pass below the shoulder line.","Fewer clean reps beat more partial ones."],w:"Shortening the range as fatigue sets in."},
 strFLpull:{f:["Legs wide and straight, body horizontal at the start and finish.","Pull the bar toward the lower chest.","Only worth training once you hold a straddle lever for 8s or more."],w:"Attempting these before the straddle hold is solid. Build the hold first."},
 flRaise:{f:["From a dead hang, raise to the lever with straight arms only.","Initiate from the lats and the scapulae.","Tuck the knees to regress."],w:"Kipping the legs up. If you need momentum, use a shorter lever."},
 iceCream:{f:["From a front lever, lean back and pull to the top of a pull-up, then return to the lever.","Keep the body one line the whole way.","Slow and deliberate \u2014 this is a control exercise."],w:"Piking at the hip during the transition."},
 blPullout:{f:["From an inverted hang, lower toward the back lever and pull straight back up.","Straight arms, tucked knees at first.","Small range at the start."],w:"Going too deep too soon. The biceps tendon is the limiter here."},
 oaFL:{f:["Tuck tight, one arm on the bar, the other free or lightly assisting.","Expect heavy rotation \u2014 fight it with the obliques.","Very short holds, both sides evenly."],w:"Attempting it before a clean full front lever. This is a late-stage progression."},

 frogStand:{f:["Hands shoulder-width, fingers spread and gripping the floor.","Knees rest on the upper arms, weight shifts forward over the hands.","Look slightly ahead, not down at your hands."],w:"Not leaning far enough forward, so you keep tipping back onto the feet."},
 elbowLever:{f:["Elbows dig into the lower ribs or hip crease.","Lean forward until the feet float, body one line.","Wrists and elbows warm before attempting."],w:"Placing the elbows too high on the abdomen, which makes the balance point impossible to find."},
 tuckPpu:{f:["From a tuck planche, bend and press without losing the protraction.","Tiny range at first \u2014 a few centimetres is a real rep.","Hips stay at shoulder height throughout."],w:"Dropping the hips to make the press easier."},
 maltLean:{f:["Arms wider than planche, leaning further forward still.","Elbows locked, shoulders open.","Very short holds \u2014 this loads the biceps tendon hard."],w:"Training this before a solid straddle planche. It is a late progression, not a shortcut."},
 deg90:{f:["Lower into a planche lean with elbows bent to 90 degrees and tucked in.","Body stays horizontal \u2014 the hips do not lift.","Build with elevated feet or a band first."],w:"Turning it into a deep pseudo planche push-up by letting the hips rise."},
 hsShrug:{f:["In a wall handstand, push tall and let the shoulders sink, then push again.","Small range, driven entirely by the scapulae.","Builds the overhead push you need for HSPU."],w:"Bending the elbows. This is a scapular movement, not a press."},

 koreanDip:{f:["Hands behind you on the bar, supinated grip.","Lower until the elbows reach about 90 degrees, hips travel under the bar.","Warm the shoulders and wrists thoroughly first."],w:"Going deep on cold shoulders. This is an extreme extension position."},
 russianDip:{f:["Lower into the dip, then roll back onto the forearms and press out.","Control the roll \u2014 no dropping onto the elbows.","Parallel bars only, never rings while learning."],w:"Slamming onto the forearms, which is how people crack an elbow."},
 bulgDip:{f:["Rings turned out at the top of every rep.","Keep the rings pinned to your sides at the bottom.","Half the depth you would use on bars, at first."],w:"Letting the rings drift wide at the bottom."},
 impDip:{f:["Arms straight, lean forward and let the hips travel back over the bars.","Very small range \u2014 this is a straight-arm lean, not a dip.","Wrists warm and shoulders prepared."],w:"Bending the elbows, which turns it back into an ordinary dip."},

 ctwHS:{f:["Chest and thighs against the wall, hands close in.","Push tall, ribs down, glutes squeezed.","This is the shape you want freestanding \u2014 build it here first."],w:"Drifting the hands away from the wall so the back arches. Walk them back in."},
 headstandH:{f:["Tripod base: head and both hands form a triangle.","Most of the weight goes through the hands, not the head.","Stack the hips over the shoulders."],w:"Loading the neck. If your neck is taking the weight, come down."},
 hsTaps:{f:["Chest to wall, shift weight fully onto one hand, tap the opposite shoulder.","Straight arms, small controlled shifts.","Work up to long unbroken sets."],w:"Rushing the shift and collapsing to the other side."},
 hsHeel:{f:["From a wall handstand, pull the heels off the wall and find balance.","Hold for a second, then touch back.","This is the bridge from wall to freestanding."],w:"Pushing off the wall hard instead of pulling gently into balance."},
 tuckHS:{f:["From a handstand, tuck the knees to the chest and hold balance.","Push tall through the shoulders as the legs move.","Teaches you to balance while the shape changes."],w:"Letting the shoulders sink as the legs tuck."},
 straddleHS:{f:["Open the legs wide and level, hips stacked over shoulders.","Lower centre of mass makes balance easier than a straight handstand.","Keep the toes pointed and the legs active."],w:"Letting one leg drop lower than the other, which pulls you off balance."},
 hsWalk:{f:["Hold 10 seconds freestanding before you try walking.","Shift weight fully to one hand, take a small step, land under the shoulder.","Small steps beat big lunges."],w:"Walking before you can hold. Hold first, walk second."},
 hsPirouette:{f:["Shift onto one hand and turn the other hand out, then follow with the body.","Keep pushing tall through both shoulders.","Learn against the wall first."],w:"Piking to turn instead of shifting the weight."},
 pikePress:{f:["Straight legs, lean the shoulders forward over the hands.","Compression from the hip flexors lifts the feet, not a jump.","Elevate the feet to regress."],w:"Jumping into it. If the feet leave the floor by momentum, it is not a press."},
 straddlePress:{f:["Wide straddle lowers the centre of mass and shortens the lever.","Lean forward first, then lift \u2014 the order matters.","Keep the arms locked throughout."],w:"Trying to lift before shifting the weight over the hands."},

 falseGrip:{f:["Wrist over the top of the ring, ring sitting in the heel of the hand.","Expect it to be uncomfortable \u2014 build tolerance gradually.","This is the gateway to the ring muscle-up."],w:"Letting the wrist slip below the ring, which makes the transition impossible."},
 ringMU:{f:["False grip throughout, pull the rings to the chest.","Fast transition, keep the rings close to the body.","Finish with a clean support hold, turned out if you can."],w:"Losing the false grip at the transition and stalling at the bottom of the dip."},
 archerPull:{f:["Pull toward one hand while the other arm stays straight out to the side.","Keep the shoulders level, chin over the working hand.","Alternate sides evenly."],w:"Letting the straight arm bend and take half the load."},
 typewriter:{f:["Pull up high, then travel side to side at the top with straight-ish arms.","Chin stays above bar height the whole traverse.","Slow travel, no bouncing."],w:"Dropping down between sides, which makes it two half pull-ups."},
 lsitPull:{f:["Hold a solid L-sit shape throughout the pull.","Legs stay level \u2014 do not let them drop as you pull.","Great combination of compression and pulling strength."],w:"Losing the L on the way down."},
 highPull:{f:["Explosive pull \u2014 aim to get the bar to your waist.","Full dead hang between reps, no bouncing.","Builds the power the strict muscle-up needs."],w:"Kipping. The whole point is generating speed from a dead start."},
 oaChinNeg:{f:["Start at the top with one arm, lower as slowly as you can.","Keep the shoulder packed down, do not let it ride up.","Both sides evenly, low volume."],w:"Dropping through the bottom half, which is the range that builds the strength."},
 hefesto:{f:["From a back lever or skin-the-cat position, pull up behind your back with a supinated grip.","Learn the negative first, and Korean dips before that.","Extreme demand on wrists, elbows and biceps \u2014 build slowly."],w:"Attempting it before a solid back lever. This is one of the highest injury-risk moves in calisthenics."},

 flagChamber:{f:["Both hands on the pole, top arm pulling and bottom arm pressing.","Knees tucked, hips stacked \u2014 no leg extension yet.","Build the press-pull balance before extending."],w:"Relying only on the top arm. The bottom arm press is half the movement."},
 tuckFlag:{f:["Top arm pulls down, bottom arm pushes up \u2014 both work equally.","Knees tucked tight, body turned so the hips face forward.","Squeeze the obliques hard."],w:"Letting the hips rotate so you end up half sideways. Square the hips."},
 strFlag:{f:["Legs wide and straight, body horizontal to the pole.","Maintain the press-pull tension the whole hold.","Straddle first, legs together much later."],w:"Piking at the hip to reduce the lever."},
 mannaH:{f:["From an L-sit, press the hips back and lift the legs past vertical.","Requires serious shoulder extension mobility \u2014 train that separately.","Tiny progressions, held briefly."],w:"Forcing the shoulder extension. Build the mobility before loading it."},
 wipers:{f:["Hang with the legs raised, rotate side to side under control.","Straight arms, minimal swing.","Tuck the knees to regress."],w:"Using momentum to swing across rather than rotating with the obliques."},

 revNordic:{f:["Kneel upright, lean back keeping hips extended.","Control the descent, come back with the quads.","Excellent knee insurance next to heavy squatting."],w:"Breaking at the hips, which turns it into a simple lean-back."},
 shrimp:{f:["Hold the rear foot behind you, lower the back knee toward the floor.","Torso upright, front shin roughly vertical.","Hold a counterweight to help balance while learning."],w:"Falling forward at the bottom instead of controlling the descent."},
 wallWalk:{f:["Start in a push-up position with your feet against the wall.","Walk the feet up the wall while the hands step back toward it.","Finish chest-to-wall with the hands close in, then reverse under control.","Ribs down and glutes squeezed the whole way \u2014 do not let the back arch."],w:"Leaving the hands too far from the wall at the top, which forces a banana shape and defeats the point."},
 wristPU:{f:["Push-up position on the backs of the hands, or on the fingertips.","Small range at first, plenty of reps.","Do these all year, not just when the wrists complain."],w:"Loading them cold or going too deep too soon."},
 scapPush:{f:["Push-up position, arms locked the whole time.","Only the shoulder blades move \u2014 protract and retract.","Slow and deliberate, no elbow bend."],w:"Bending the elbows, which turns it into a partial push-up."},
 negPull:{f:["Jump or step to the top, then lower as slowly as you can.","Aim for five seconds, chest staying high.","Best builder when strict reps are still out of range."],w:"Dropping through the bottom half, which is where the strength is."},
 chinup:{f:["Supinated grip, shoulder width.","Full dead hang, chin clearly over the bar.","More biceps than a pull-up, so useful alongside straight-arm work."],w:"Cutting the range at the bottom."},
 widePull:{f:["Hands well outside shoulder width.","Pull the chest toward the bar, elbows down.","Expect fewer reps than a standard pull-up."],w:"Going so wide that the shoulder cannot move freely."},
 topHold:{f:["Hold at the top with the chin over the bar.","Elbows down and back, chest to the bar.","Builds the position you stall in on a strict muscle-up."],w:"Letting the chin drop slowly through the hold."},
 muTrans:{f:["Use a low bar so your feet can help.","Drill the turnover slowly, keeping the bar close.","Volume here beats grinding failed muscle-ups."],w:"Practising with the bar drifting away from the body."},
 invRow:{f:["Bar at hip height, body straight from head to heels.","Pull the chest to the bar, squeeze the blades.","Lower the bar to make it harder."],w:"Hips sagging so it becomes a partial row."},
 diamondPU:{f:["Hands together under the chest, elbows tucked close.","Body one line, full range.","Heavy on the triceps and the wrists."],w:"Flaring the elbows out, which removes the triceps work."},
 widePU:{f:["Hands well outside the shoulders.","Chest to the floor, elbows around 45\u00b0.","More chest, less triceps."],w:"Going so wide the shoulders take the load instead."},
 benchDip:{f:["Hands behind you on a bench, feet out in front.","Lower until the elbows reach 90\u00b0, no deeper.","A regression, not a main lift \u2014 move to bar dips when you can."],w:"Dropping too deep, which strains the front of the shoulder."},
 negDip:{f:["Start at the top, lower as slowly as you can.","Stop at shoulder level, then step or jump back up.","The best route in when strict dips are not there yet."],w:"Freefalling the last part of the descent."},
 hangLeg:{f:["Straight legs, raise to at least parallel.","Control the swing \u2014 start from a dead hang each rep.","Posterior pelvic tilt at the top."],w:"Swinging into every rep and calling it momentum."},
 kneeRaise:{f:["Knees to chest, no swing.","Curl the pelvis at the top rather than just lifting the thighs.","The regression for straight leg raises."],w:"Only lifting the knees without any pelvic tilt."},
 hollowRock:{f:["Lower back pressed flat, rock from the shoulders.","Small controlled rocking, no arching.","Stop the set when the back lifts off."],w:"Rocking from the hips with an arched back."},
 archHold:{f:["Face down, arms and legs lifted, squeezing the glutes.","The opposite of hollow \u2014 train both.","Look at the floor, not forward."],w:"Cranking the neck up, which is where the strain shows up."},
 pikeComp:{f:["Sit with straight legs, press the hands down and lift the heels.","Tiny lift is a real rep \u2014 compression strength is slow to build.","Essential for the V-sit and pressing to handstand."],w:"Bending the knees to get height."},
 boxJump:{f:["Land softly with bent knees, step down rather than jumping down.","Box height is not the point \u2014 landing quality is.","Keep it well away from heavy squat days."],w:"Jumping down and hammering the knees and achilles."},
 jumpSquat:{f:["Full squat, explode up, land soft.","Low reps, high quality.","Skip these the day before kickboxing."],w:"Grinding out high reps until the landing gets sloppy."},
 burpee:{f:["Chest to floor at the bottom, full stand at the top.","Keep a steady pace rather than sprinting the first ten.","Conditioning, not strength."],w:"Half push-ups at the bottom once fatigue sets in."},
 bearCrawl:{f:["Knees hovering just off the floor, back flat.","Opposite hand and foot move together.","Short distances, good as a warm-up."],w:"Hips bouncing up and down with every step."},

 machPress:{f:["Set the seat so the handles line up with your mid chest.","Shoulder blades pinned back against the pad.","Full lockout without letting the shoulders roll forward."],w:"Setting the seat too high, which turns it into a shoulder press."},
 machIncline:{f:["Handles should line up with your upper chest.","Same blade position \u2014 back and down.","Slightly lighter than flat, expect that."],w:"Shrugging the shoulders up to move more weight."},
 pecDeck:{f:["Slight bend in the elbows, held throughout.","Squeeze at the middle for a beat.","Moderate weight \u2014 this is a stretch and squeeze movement."],w:"Going too heavy and turning it into a press."},
 cableCross:{f:["Slight forward lean, arms in a wide arc.","Bring the handles together in front of the lower chest.","Control the return, do not let the stack pull you back."],w:"Bending the elbows to push more weight."},
 dbBench:{f:["Dumbbells at the lower chest, elbows around 45\u00b0.","Blades pinned, feet planted.","Great alongside dips \u2014 the free range suits shoulders doing planche work."],w:"Clashing the dumbbells together at the top and losing tension."},
 dbIncline:{f:["Bench at 30\u201345\u00b0, no steeper.","Press up and slightly back, not straight forward.","Upper chest bias, useful next to dips."],w:"Setting the bench too steep so it becomes a shoulder press."},
 dbFly:{f:["Soft elbows, fixed angle throughout.","Open only as far as you control.","Light weight, long tension."],w:"Dropping into a deep stretch with heavy dumbbells."},
 latPull:{f:["Grip just outside shoulder width, chest up.","Pull the bar to the collarbone, elbows down.","Control the return \u2014 do not let it yank you up."],w:"Leaning back and turning it into a row."},
 seatedRow:{f:["Chest up, torso still.","Pull to the lower ribs, squeeze the blades.","Full stretch at the front without rounding the back."],w:"Rocking backwards and forwards to move the stack."},
 chestRow:{f:["Chest against the pad removes the lower back entirely.","Pull to the ribs, elbows close.","Useful on days your back is already loaded from lever work."],w:"Lifting the chest off the pad at the end of the set."},
 dbRow:{f:["Flat back, one hand supported.","Pull to the hip, elbow close to the body.","Full stretch at the bottom."],w:"Twisting the torso to lift heavier."},
 machShoulder:{f:["Seat set so the handles start at ear height.","Ribs down, no lower back arch.","Full lockout without shrugging."],w:"Arching the back to press \u2014 that load goes straight to the lumbar spine."},
 dbShoulder:{f:["Start at ear height, press up and slightly in.","Brace the midsection, glutes on.","Seated with back support if the lower back complains."],w:"Leaning back to turn it into an incline press."},
 cableLat:{f:["Cable from behind the body, lead with the elbow.","Stop at shoulder height.","Light weight and a slow lowering."],w:"Swinging the whole body to start each rep."},
 rearDelt:{f:["Bent over or chest-supported, elbows slightly bent.","Lead with the elbows, squeeze the rear delts.","Light \u2014 this is a small muscle."],w:"Using the traps and upper back instead of the rear delts."},
 facePull:{f:["Rope at face height, pull toward the forehead.","External rotation at the end \u2014 thumbs back.","Excellent shoulder insurance next to planche work."],w:"Going heavy and losing the rotation, which is the whole point."},
 tricepPush:{f:["Elbows pinned at the sides.","Full extension, slow return.","Keep the torso still."],w:"Leaning over the bar and turning it into a press."},
 hammerCurl:{f:["Neutral grip, elbows fixed.","Controlled lowering.","Kinder on the elbows than a supinated curl next to lever work."],w:"Swinging from the hips."},
 legPress:{f:["Feet mid-platform, shoulder width.","Lower until the knees reach about 90\u00b0, back flat on the pad.","Do not lock the knees hard at the top."],w:"Letting the lower back round off the pad at the bottom."},
 legExt:{f:["Pause a beat at the top.","Moderate weight, controlled lowering.","Useful accessory, not a squat replacement."],w:"Slamming into full extension with heavy weight."},
 seatCurl:{f:["Full range, pause at peak contraction.","Keep the hips down on the seat.","Good hamstring work alongside RDLs and kicking."],w:"Lifting the hips to finish the rep."},
 kick:{f:["Log the session length and how hard it felt.","Never squat within 24 hours before this.","Hydrate \u2014 it is the highest-sweat session of your week."],w:"Treating it as a rest day. It is a hard leg and conditioning session."},
 run:{f:["Easy pace unless you planned otherwise.","Keep it short on days around heavy squats."],w:"Adding running volume on top of an already full week."},
 bike:{f:["Useful as low-impact conditioning between hard days.","Keep the intensity low if legs are sore."],w:"Turning recovery work into another hard session."},
 rope:{f:["Light on the feet, relaxed shoulders.","Good warm-up before kickboxing."],w:"Long grinding sets that just fatigue the calves."},
 mobility:{f:["Wrists, shoulders and thoracic spine are the priorities for your goals.","Little and often beats one long session."],w:"Only doing it when something already hurts."}
};

};

var DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DAY3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DAY1=["S","M","T","W","T","F","S"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var TARGET=84,START=74,KCAL=2900,STORE="straightarm.v1";

/* ============ state ============ */
var S={weights:[],sessions:[],templates:{},schedule:{},targets:{},nutrition:[]};
var tab="today",log={},selDate=null,calMonth=null,viewType=null;
var sheet=null,dial=null,info=null,pickFor=null,openDay=null;
var tId=null,tVal=0,tMode="hold",tRun=false,restLen=180;

function loadState(){try{var r=localStorage.getItem(STORE);if(r){var p=JSON.parse(r);
  S.weights=p.weights||[];S.sessions=p.sessions||[];S.templates=p.templates||{};S.schedule=p.schedule||{};S.targets=p.targets||{};S.nutrition=p.nutrition||[];}}catch(e){}}
function saveState(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return iso(new Date());}
function dowNow(){return new Date().getDay();}
function dObj(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dowOf(s){return dObj(s).getDay();}
function weekOf(s){
  var d=dObj(s),st=new Date(d);st.setDate(d.getDate()-d.getDay());
  var out=[];for(var i=0;i<7;i++){var x=new Date(st);x.setDate(st.getDate()+i);out.push(iso(x));}
  return out;
}
function monthShift(s,n){var d=dObj(s);d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d);}
function monthLabel(s){var d=dObj(s);return MON[d.getMonth()]+" "+d.getFullYear();}
function selDow(){return dowOf(selDate);}
function fmtD(s){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  return DAY3[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function ago(s){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);var n=new Date();n.setHours(0,0,0,0);
  return Math.round((n-d)/864e5);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function reg(p){if(p.length<4)return null;var n=p.length,mx=0,my=0,i;
  for(i=0;i<n;i++){mx+=p[i].x;my+=p[i].y;}mx/=n;my/=n;var a=0,b=0;
  for(i=0;i<n;i++){a+=(p[i].x-mx)*(p[i].y-my);b+=Math.pow(p[i].x-mx,2);}
  return b===0?null:(a/b)*7;}
function best(k){var b=0;S.sessions.forEach(function(s){var a=(s.ex||{})[k];if(!a)return;
  a.forEach(function(x){var v=parseFloat(x.v)||0;if(v>b)b=v;});});return b;}
function rate(){return reg(S.weights.filter(function(x){return ago(x.d)<=21;})
  .map(function(x){return {x:-ago(x.d),y:x.kg};}));}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;
  document.body.appendChild(t);setTimeout(function(){t.remove();},1900);}

function dayType(i){return S.schedule[i]||WEEK[i];}
function curType(){return viewType||dayType(selDow());}
function list(t){return S.templates[t]?S.templates[t].slice():(SESSIONS[t]||{ex:[]}).ex.slice();}
function setList(t,a){S.templates[t]=a.slice();saveState();}
function schedChanged(){for(var q in S.schedule)return true;return false;}

/* ============ shared bits ============ */
function meter(id){
  var e=EX[id],b=best(id),p=Math.min(100,b/e.goal*100),done=b>=e.goal;
  return '<div class="meter"><div class="meter-top">'+
    '<span class="meter-v num">'+(b>0?b+"s best":"Not logged yet")+'</span>'+
    '<span class="meter-g">'+e.goal+'s → '+e.prog+'</span></div>'+
    '<div class="track"><div class="fill'+(done?" done":"")+'" style="width:'+p+'%"></div></div>'+
    (done?'<div class="meter-msg">Threshold reached. Hold 3 × '+e.goal+'s cleanly on two separate sessions, then step up.</div>':'')+
    '</div>';
}
/* ---- targets and progression ---- */
function exTarget(id){return S.targets[id]||EX[id].t;}
function planRange(id){
  var t=exTarget(id),m=t.match(/×\s*(\d+(?:\.\d+)?)(?:\s*[–-]\s*(\d+(?:\.\d+)?))?/);
  if(!m)m=t.match(/(\d+(?:\.\d+)?)(?:\s*[–-]\s*(\d+(?:\.\d+)?))?/);
  if(!m)return null;
  return {lo:parseFloat(m[1]),hi:m[2]?parseFloat(m[2]):parseFloat(m[1])};
}
function planVal(id){var r=planRange(id);return r?String(r.lo):"";}
function planKg(id){var m=exTarget(id).match(/(?:\+|·\s*)(\d+(?:\.\d+)?)\s*kg/);return m?m[1]:"";}
function loadStep(id){return EX[id].cat==="Legs"?5:2.5;}

function history(id,days){
  var out=[];
  S.sessions.forEach(function(s){
    var a=(s.ex||{})[id];if(!a)return;
    var g=ago(s.d);if(g<0||g>days)return;
    out.push({d:s.d,g:g,
      v:Math.max.apply(null,a.map(function(x){return parseFloat(x.v)||0;})),
      kg:Math.max.apply(null,a.map(function(x){return parseFloat(x.kg)||0;})),
      n:a.length});
  });
  out.sort(function(x,y){return x.g-y.g;});
  return out;
}
function suggest(id){
  var e=EX[id],h=history(id,42),r=planRange(id);
  if(!r||h.length<2||e.k==="mins")return null;
  var recent=h.slice(0,3),older=h.slice(3,6),t=exTarget(id);
  var bestR=Math.max.apply(null,recent.map(function(x){return x.v;}));

  var rec2=h.slice(0,2),old3=h.slice(2,5);
  if(old3.length>=2){
    var bestN=Math.max.apply(null,rec2.map(function(x){return x.v;}));
    var bestO=Math.max.apply(null,old3.map(function(x){return x.v;}));
    if(bestO>0&&bestN<bestO*0.85)
      return {kind:"steady",head:"Hold the target where it is",
        body:"Your best has slipped from "+bestO+" to "+bestN+" over the last few weeks. Look at sleep, food, and whether this sits too close to another hard day."};
  }
  if(e.k==="hold"){
    var goal=e.goal||30,hits=recent.filter(function(x){return x.v>=goal;}).length;
    if(hits>=2)return {kind:"step",head:"Ready to step up",
      body:"You held "+goal+"s or more in "+hits+" of the last "+recent.length+" sessions. Move to "+e.prog+" and expect the numbers to drop. That is the point."};
    return null;
  }
  if(e.k==="load"){
    var st=loadStep(id),pk=parseFloat(planKg(id)),named=!isNaN(pk);
    var lifted=Math.max.apply(null,recent.map(function(x){return x.kg;}));
    var base=named?pk:lifted;
    if(!base)return null;
    var strong=recent.filter(function(x){return x.v>=r.hi&&x.kg>=base;}).length;
    if(strong>=2){
      var nk=base+st;
      return {kind:"load",head:"Add "+st+" kg",
        body:"You hit "+r.hi+" reps at "+base+" kg in "+strong+" of the last "+recent.length+" sessions. Move to "+nk+" kg and let the reps come back down.",
        newT:named?t.replace(/(?:\+|·\s*)\d+(?:\.\d+)?\s*kg/,"· "+nk+" kg"):t+" · "+nk+" kg"};
    }
    return null;
  }
  var hitTop=recent.filter(function(x){return x.v>=r.hi;}).length;
  if(hitTop>=2){
    if(bestR>=r.hi*1.5)
      return {kind:"form",head:"This has got too easy",
        body:"You are doing "+bestR+" reps against a target of "+r.hi+". More reps stops building much strength here. Move to a harder variation or add load instead."};
    var lo=r.lo+2,hi=r.hi+2,band=(r.lo===r.hi)?String(hi):lo+"–"+hi;
    return {kind:"reps",head:"Raise the target to "+band,
      body:"You reached "+r.hi+" reps in "+hitTop+" of the last "+recent.length+" sessions. Push the target up and keep the same form standard.",
      newT:t.replace(/×\s*\d+(?:\.\d+)?(?:\s*[–-]\s*\d+(?:\.\d+)?)?/,"× "+band)};
  }
  return null;
}
function allSuggestions(type){
  var out=[];
  list(type).forEach(function(id){
    if(!EX[id])return;
    var s=suggest(id);if(s)out.push({id:id,s:s});
  });
  return out;
}
function newSet(id){
  var e=EX[id],a=log[id]||[],prev=a.length?a[a.length-1]:null;
  if(prev)return e.k==="load"?{v:prev.v,kg:prev.kg}:{v:prev.v};
  return e.k==="load"?{v:planVal(id),kg:planKg(id)}:{v:planVal(id)};
}
function exCard(id,i,n,type){
  var e=EX[id];if(!e)return "";
  var sets=log[id]||[],u=e.k==="hold"?"s":e.k==="mins"?"min":e.k==="load"?"":"reps",h="";
  sets.forEach(function(s,j){
    h+='<div class="set">'+
      '<button class="stp" data-act="dec" data-ex="'+id+'" data-i="'+j+'" aria-label="One less">&minus;</button>'+
      '<input inputmode="decimal" data-ex="'+id+'" data-i="'+j+'" data-f="v" value="'+esc(s.v)+'" placeholder="0">'+
      '<span class="u">'+u+'</span>'+
      '<button class="stp" data-act="inc" data-ex="'+id+'" data-i="'+j+'" aria-label="One more">+</button>';
    if(e.k==="load")h+='<span class="u">×</span><input inputmode="decimal" style="width:42px" data-ex="'+id+'" data-i="'+j+'" data-f="kg" value="'+esc(s.kg||"")+'" placeholder="kg"><span class="u">kg</span>';
    h+='<span class="rm" data-act="delset" data-ex="'+id+'" data-i="'+j+'">×</span></div>';
  });
  if(e.k==="hold")h+='<button class="time-btn" data-act="dial" data-ex="'+id+'">'+I.clock+'Time a hold</button>';
  h+='<button class="ghost-btn" data-act="addset" data-ex="'+id+'">Add set</button>';
  return '<div class="card"><div class="ex-top"><div class="ex-gly">'+glyph(id)+'</div><div><div class="ex-name">'+e.n+'</div>'+
    '<span class="chip">'+exTarget(id)+(S.targets[id]?" · edited":"")+'</span></div><div class="ex-tools">'+
    (i>0?'<button class="icb" data-act="up" data-ex="'+id+'" data-t="'+type+'">'+I.up+'</button>':'')+
    (i<n-1?'<button class="icb" data-act="down" data-ex="'+id+'" data-t="'+type+'">'+I.down+'</button>':'')+
    '<button class="icb" data-act="info" data-ex="'+id+'">'+I.info+'</button>'+
    '<button class="icb dngr" data-act="rmex" data-ex="'+id+'" data-t="'+type+'">'+I.x+'</button></div></div>'+
    '<div class="sets">'+h+'</div>'+(e.k==="hold"?meter(id):'')+'</div>';
}

/* ============ nutrition ============ */
var PROT_LO=130,PROT_HI=140,FAT_LO=70,FAT_HI=85;
/* carbs are whatever is left once protein and fat are covered */
function carbTarget(){return Math.round((KCAL-((PROT_LO+PROT_HI)/2)*4-((FAT_LO+FAT_HI)/2)*9)/4/10)*10;}
function kcalFromMacros(n){
  if(!n||n.p==null||n.c==null||n.f==null)return null;
  return Math.round(n.p*4+n.c*4+n.f*9);
}
function nutOn(d){var r=null;S.nutrition.forEach(function(x){if(x.d===d)r=x;});return r;}
function nutAvg(days,f){
  var v=S.nutrition.filter(function(x){var g=ago(x.d);return g>=0&&g<days&&x[f]!=null;});
  return v.length?v.reduce(function(a,x){return a+x[f];},0)/v.length:null;
}
function nutRange(a,b,f){
  var v=S.nutrition.filter(function(x){return x.d>=a&&x.d<=b&&x[f]!=null;});
  return v.length?v.reduce(function(s,x){return s+x[f];},0)/v.length:null;
}
function setNut(d,kcal,pr,cb,ft){
  var prev=nutOn(d)||{};
  S.nutrition=S.nutrition.filter(function(x){return x.d!==d;});
  var o={d:d};
  [["kcal",kcal],["p",pr],["c",cb],["f",ft]].forEach(function(pair){
    var k=pair[0],v=pair[1];
    if(v!=null&&!isNaN(v))o[k]=Math.round(v);
    else if(prev[k]!=null)o[k]=prev[k];
  });
  if(o.kcal!=null||o.p!=null||o.c!=null||o.f!=null)S.nutrition.push(o);
  S.nutrition.sort(function(x,y){return x.d<y.d?-1:1;});
}
/* rough: a kilo of gained tissue treated as about 7700 kcal */
function intakeAdvice(){
  var r=rate(),k=nutAvg(10,"kcal");
  if(r===null||k===null)return null;
  return {rate:r,avg:Math.round(k),target:Math.round((k-(r-0.3)*1100)/10)*10};
}
/* values handed over by a Shortcut: ?kcal=2870&p=138&w=79.4&d=2026-08-11 */
function readParams(){
  if(typeof location==="undefined"||!location.search)return null;
  try{
    var q=new URLSearchParams(location.search),got=[];
    var d=q.get("d")||today();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=today();
    var kcal=parseFloat(q.get("kcal")),pr=parseFloat(q.get("p")),
        cb=parseFloat(q.get("c")),ft=parseFloat(q.get("f")),w=parseFloat(q.get("w"));
    if(!isNaN(kcal)||!isNaN(pr)||!isNaN(cb)||!isNaN(ft)){
      setNut(d,isNaN(kcal)?null:kcal,isNaN(pr)?null:pr,isNaN(cb)?null:cb,isNaN(ft)?null:ft);
      if(!isNaN(kcal))got.push(Math.round(kcal)+" kcal");
      var m=[];
      if(!isNaN(pr))m.push(Math.round(pr)+"P");
      if(!isNaN(cb))m.push(Math.round(cb)+"C");
      if(!isNaN(ft))m.push(Math.round(ft)+"F");
      if(m.length)got.push(m.join(" / ")+" g");
    }
    if(!isNaN(w)&&w>40&&w<200){
      S.weights=S.weights.filter(function(x){return x.d!==d;});
      S.weights.push({d:d,kg:w});
      S.weights.sort(function(x,y){return x.d<y.d?-1:1;});
      got.push(w.toFixed(1)+" kg");
    }
    if(got.length){
      saveState();
      if(typeof history!=="undefined"&&history.replaceState)history.replaceState(null,"",location.pathname);
      return "Logged "+got.join(", ")+(d===today()?"":" for "+fmtD(d));
    }
  }catch(e){}
  return null;
}

/* ============ plan maker ============ */
function viewPlan(){
  var order=[1,2,3,4,5,6,0];
  var h='<div class="hdr">'+BRAND+'<div class="eyebrow">Plan maker</div>'+
    '<div class="h1">Your week,<br>as you set it</div>'+
    '<div class="sub">Set what each day defaults to, then open a day to build its exercise list. Today follows whatever you set here.</div></div><div class="wrap">'+
    '<div class="lbl"><span>Seven days</span>'+
      (schedChanged()?'<button data-act="resetsched">Reset schedule</button>':'')+'</div>';

  order.forEach(function(i){
    var t=dayType(i),L=list(t),open=openDay===i;
    var names=L.slice(0,3).map(function(id){return EX[id]?EX[id].n:id;}).join(" · ");
    if(L.length>3)names+=" +"+(L.length-3);
    var opts="";for(var k in SESSIONS)opts+='<option value="'+k+'"'+(k===t?" selected":"")+'>'+SESSIONS[k].name+'</option>';

    h+='<div class="dcard"><div class="dhead" data-act="openday" data-d="'+i+'">'+
      '<div class="ddow">'+DAY3[i]+'</div><div class="dinfo">'+

/* ============ trends ============ */
function wChart(){
  var p=S.weights.filter(function(x){return ago(x.d)<=90;});
  if(p.length<2)return '<div class="card"><div class="empty">Log two morning weights and the trend line appears here.</div></div>';
  var W=320,H=118,P=6;
  var xs=p.map(function(q){return -ago(q.d);});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs.concat([0]));
  var ys=p.map(function(q){return q.kg;});
  var y0=Math.min.apply(null,ys.concat([START]))-.7,y1=Math.max.apply(null,ys.concat([TARGET]))+.7;
  var X=function(v){return P+((v-x0)/((x1-x0)||1))*(W-2*P);};
  var Y=function(v){return P+(1-(v-y0)/((y1-y0)||1))*(H-2*P);};
  var d="",c="";

  var area="M"+X(x0).toFixed(1)+" "+H+" "+d.replace(/^M/,"L")+"L"+X(-ago(p[p.length-1].d)).toFixed(1)+" "+H+"Z";

    '<stop offset="0" stop-color="#2450FF" stop-opacity=".16"/><stop offset="1" stop-color="#2450FF" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g)"/>'+

    '<path d="'+d+'" fill="none" stroke="#2450FF" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+c+

    '<span><i class="sw" style="background:#0E9F6E"></i>'+TARGET+' kg goal</span></div></div>';

function kChart(){

function wkHolds(){
  var m={};
  S.sessions.forEach(function(s){var w=Math.floor(ago(s.d)/7);if(w>11||w<0)return;
    ["tuckP","tuckFL"].forEach(function(k){var a=(s.ex||{})[k];if(!a)return;
      var b=Math.max.apply(null,a.map(function(x){return parseFloat(x.v)||0;}));
      m[w]=m[w]||{};if(b>(m[w][k]||0))m[w][k]=b;});});

}
function hChart(m){
  var any=false;for(var q in m)any=true;

    '<div class="wrap"><div class="note '+f.c+'"><span class="note-k">'+f.k+'</span>'+f.t+'</div>'+
    '<div class="grid2">'+
      '<div class="stat"><div class="stat-k">7-day average</div><div class="stat-v num">'+(a7!==null?a7.toFixed(1):"—")+'<span class="u"> kg</span></div><div class="stat-s">Smooths daily noise</div></div>'+
      '<div class="stat"><div class="stat-k">Rate</div><div class="stat-v num">'+(r!==null?(r>0?"+":"")+r.toFixed(2):"—")+'</div><div class="stat-s">kg per week</div></div>'+
      '<div class="stat"><div class="stat-k">Tuck planche</div><div class="stat-v num">'+(best("tuckP")||"—")+'<span class="u">s</span></div><div class="stat-s">Best hold · 15s step</div></div>'+
      '<div class="stat"><div class="stat-k">Tuck front lever</div><div class="stat-v num">'+(best("tuckFL")||"—")+'<span class="u">s</span></div><div class="stat-s">Best hold · 15s step</div></div>'+
      '<div class="stat"><div class="stat-k">Calories</div><div class="stat-v num">'+(kAvg!==null?Math.round(kAvg):"—")+'</div><div class="stat-s">7-day average · target '+KCAL+'</div></div>'+

    '</div><div class="lbl"><span>Bodyweight</span></div>'+wChart()+
