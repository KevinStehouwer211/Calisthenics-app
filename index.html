/* ============ weekly review ============ */
function weekBounds(w){
  var n=new Date();n.setHours(0,0,0,0);
  var end=new Date(n);end.setDate(n.getDate()-n.getDay()-7*w+6);
  var st=new Date(end);st.setDate(end.getDate()-6);
  return {a:iso(st),b:iso(end),
    lab:st.getDate()+" "+MON[st.getMonth()]+" – "+end.getDate()+" "+MON[end.getMonth()]};
}
function weekReview(w){
  var b=weekBounds(w);
  var ss=S.sessions.filter(function(s){return s.d>=b.a&&s.d<=b.b;});
  var ws=S.weights.filter(function(x){return x.d>=b.a&&x.d<=b.b;});
  var avg=ws.length?ws.reduce(function(a,x){return a+x.kg;},0)/ws.length:null;
  var prev=w<11?(function(){var p=weekBounds(w+1);
    var q=S.weights.filter(function(x){return x.d>=p.a&&x.d<=p.b;});
    return q.length?q.reduce(function(a,x){return a+x.kg;},0)/q.length:null;})():null;
  var holds={};
  ss.forEach(function(s){for(var k in (s.ex||{})){ if(!EX[k]||EX[k].k!=="hold")continue;
    var m=Math.max.apply(null,s.ex[k].map(function(x){return parseFloat(x.v)||0;}));
    if(m>(holds[k]||0))holds[k]=m;}});
  return {b:b,n:ss.length,avg:avg,delta:(avg!==null&&prev!==null)?avg-prev:null,holds:holds,
    kcal:nutRange(b.a,b.b,"kcal"),prot:nutRange(b.a,b.b,"p"),
    carb:nutRange(b.a,b.b,"c"),fat:nutRange(b.a,b.b,"f"),
    types:ss.map(function(s){return SESSIONS[s.type]?SESSIONS[s.type].name:s.type;})};
}
function reviewData(n){
  var out=[];
  for(var w=0;w<n;w++){var r=weekReview(w);if(r.n||r.avg!==null)out.push(r);}
  return out;
}

/* ============ weekly summary, for pasting into a chat ============ */
function summaryText(){
  var rs=reviewData(6),out=["Training log, most recent week first."];
  rs.forEach(function(r,i){
    var hs=[];for(var k in r.holds)hs.push(EX[k].n+" "+r.holds[k]+"s");
    out.push((i===0?"This week":i+" weeks ago")+" ("+r.b.lab+"): "+r.n+" session"+(r.n===1?"":"s")+
      (r.avg!==null?", bodyweight "+r.avg.toFixed(1)+" kg"+(r.delta!==null?" ("+(r.delta>0?"+":"")+r.delta.toFixed(2)+" vs the week before)":""):"")+
      (r.kcal!==null?", intake "+Math.round(r.kcal)+" kcal":"")+
      ((r.prot!==null||r.carb!==null||r.fat!==null)?" ("+
        [r.prot!==null?Math.round(r.prot)+"g protein":null,r.carb!==null?Math.round(r.carb)+"g carbs":null,
         r.fat!==null?Math.round(r.fat)+"g fat":null].filter(Boolean).join(", ")+")":"")+
      (hs.length?", best holds "+hs.join(", "):"")+
      (r.types.length?", sessions: "+r.types.join(", "):"")+".");
  });
  var sg=[];
  for(var t in SESSIONS)allSuggestions(t).forEach(function(o){
    var line=EX[o.id].n+": "+o.s.head;
    if(sg.indexOf(line)<0)sg.push(line);
  });
  out.push("");
  out.push("Active suggestions from the log: "+(sg.length?sg.join("; "):"none")+".");
  out.push("");
  out.push("Context: 183 cm, bulking slowly toward "+TARGET+" kg at about "+KCAL+" kcal, working toward the front lever and planche. "+
    "Four fixed training days plus kickboxing. Raced karting at a weight cap for years before this.");
  out.push("");
  out.push("Write a short weekly review: what actually changed, the single most important thing for next week, "+
    "and flag anything that looks like bodyweight outrunning straight-arm strength.");
  return out.join("\n");
}

    'Dips and planche both load the front of the shoulder and the biceps tendon, so your chest volume is capped by what '+
    'the shoulder recovers from, not by what the chest could handle alone.'+
    '<br><br><b>One heavy vertical press.</b> Weighted dips, 4 × 6–8. This is the main chest lift now, not an afterthought.'+
    '<br><br><b>One horizontal press.</b> Ring push-ups or archer push-ups, 3 × 8. Rings let the shoulder find its own path, '+
    'which matters when the same joint did planche work an hour earlier.'+
    '<br><br>Both go after the skill holds. If your planche lean or tuck hold drops after two weeks of the added chest '+
    'volume, cut the chest work — not the skill work.</div></div>'+
    '<div class="lbl"><span>Progression map</span></div><div class="card pad"><div class="prose">'+
    '<b>Front lever.</b> Tuck, advanced tuck with one knee out, straddle, full. Straddle is realistically 6–12 months from tuck.'+
    '<br><br><b>Planche.</b> A 30s lean, tuck, advanced tuck, straddle. Straddle often takes 18 months or more. That is normal, not slow.'+
    '<br><br><b>Muscle-up.</b> The kip hides a transition weakness. Sternum-to-bar pull-ups and slow negatives fix it faster than more kipping reps.'+
    '</div></div><div class="lbl"><span>Eating</span></div><div class="card pad"><div class="prose">'+
    '<b>'+KCAL+' kcal, '+PROT_LO+'–'+PROT_HI+' g protein, about '+carbTarget()+' g carbs and '+FAT_LO+'–'+FAT_HI+' g fat.</b> '+
    'Protein and fat are the floors worth holding; carbs take whatever calories are left. Weigh in a few mornings a week and use the weekly average — the daily '+
    'number is noise. Settle around 0.3 kg a week and '+TARGET+' kg arrives in four to five months.'+
    '<br><br>Carbs higher on kickboxing and squat days. After years of making weight for karting, the useful skill now is '+
    'eating well without tracking every gram. The trend line does the work.</div></div>'+
    '<div class="lbl"><span>Backup</span></div><div class="card pad">'+
    '<div class="prose" style="margin-bottom:11px">Everything lives on this device, including your schedule and custom sessions. Copy this out before you clear browser data or switch phones.</div>'+
    '<textarea id="io" readonly>'+esc(JSON.stringify(S))+'</textarea>'+
    '<div class="row" style="margin-top:10px"><button class="cta soft" data-act="copy">Copy backup</button>'+
    '<button class="cta soft" data-act="restore">Restore</button></div></div></div>';
  return h;
}

/* ============ layers ============ */
function pickList(q){
  var L=list(pickFor),h="",ql=(q||"").toLowerCase();
  CATS.forEach(function(c){var rows="";
    for(var id in EX){var e=EX[id];if(e.cat!==c)continue;
      if(ql&&e.n.toLowerCase().indexOf(ql)<0&&c.toLowerCase().indexOf(ql)<0)continue;
      var on=L.indexOf(id)>=0;
      rows+='<div class="pick'+(on?" in":"")+'" data-act="pick" data-ex="'+id+'">'+
        '<div class="pick-g">'+glyph(id)+'</div>'+
        '<div><div class="pick-n">'+e.n+'</div><div class="pick-t">'+exTarget(id)+'</div></div>'+
        '<div class="pick-b">'+(on?I.check:I.plus)+'</div></div>';}
    if(rows)h+='<div class="cat">'+c+'</div>'+rows;});
  return h||'<div class="empty">Nothing matches that. Try a shorter word.</div>';
}
function dialHTML(){
  var e=EX[dial],R=104,C=2*Math.PI*R;
  var goal=e.goal||30;
  var frac=tMode==="hold"?Math.min(1,tVal/goal):(restLen?tVal/restLen:0);
  var off=C*(1-frac);
  var big=tMode==="hold"?tVal.toFixed(1):(Math.floor(tVal/60)+":"+String(Math.floor(tVal%60)).padStart(2,"0"));
  return '<div class="scrim" data-act="closebg"><div class="sheet"><div class="grab"></div>'+
    '<div class="dial-wrap"><div class="dial-ex">'+e.n+'</div><div class="dial-sub">'+exTarget(dial)+'</div>'+
    '<div class="seg"><button data-act="mode" data-m="hold" class="'+(tMode==="hold"?"on":"")+'">Hold</button>'+
    '<button data-act="mode" data-m="rest" class="'+(tMode==="rest"?"on":"")+'">Rest</button></div>'+
    '<div class="dial"><svg width="236" height="236" viewBox="0 0 236 236">'+
      '<circle class="dial-ring" cx="118" cy="118" r="'+R+'" fill="none" stroke-width="13"/>'+
      '<circle id="darc" class="dial-arc'+(tMode==="hold"&&tVal>=goal?" over":"")+'" cx="118" cy="118" r="'+R+'" fill="none" stroke-width="13" '+
        'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
      '<div class="dial-mid"><div id="dnum" class="dial-n'+(tRun?" pulse":"")+'">'+big+'</div>'+
      '<div class="dial-u">'+(tMode==="hold"?"seconds held":"rest remaining")+'</div></div></div>'+
    '<div class="dial-tip">'+(tMode==="hold"
      ?'Ring fills to your '+goal+'s step-up. Stop two seconds before form breaks.'
      :'Two to three minutes between skill holds and heavy sets.')+'</div>'+
    (tMode==="hold"
      ?(tRun?'<button class="cta blue" id="dbtn" data-act="stophold">Stop and log '+tVal.toFixed(1)+'s</button>'
            :'<button class="cta blue" data-act="starthold">Start hold</button>')
      :'<div class="row"><button class="cta soft" data-act="rest" data-s="90">90s</button>'+
       '<button class="cta soft" data-act="rest" data-s="120">2 min</button>'+
       '<button class="cta soft" data-act="rest" data-s="180">3 min</button></div>')+
    '<div style="height:9px"></div><button class="cta soft" data-act="close">Close</button>'+
    '</div></div></div>';
}
function calHTML(){
  var m=dObj(calMonth),y=m.getFullYear(),mo=m.getMonth();
  var lead=(new Date(y,mo,1).getDay()+6)%7;          /* Monday-first */
  var n=new Date(y,mo+1,0).getDate();
  var hdr=["M","T","W","T","F","S","S"],g="";
  hdr.forEach(function(x){g+='<div class="cal-h">'+x+'</div>';});
  for(var i=0;i<lead;i++)g+='<div></div>';
  for(var day=1;day<=n;day++){
    var ds=iso(new Date(y,mo,day));
    var logged=S.sessions.some(function(x){return x.d===ds;});
    var weighed=S.weights.some(function(x){return x.d===ds;});
    var t=dayType(dowOf(ds)),restDay=t==="rest";
    g+='<div class="cal-d'+(ds===selDate?" sel":"")+(ds===today()?" now":"")+
       (ago(ds)<0?" fut":"")+'" data-act="calpick" data-d="'+ds+'">'+
       '<span>'+day+'</span><div class="cal-dots">'+
       (logged?'<i class="cd log"></i>':(restDay?'':'<i class="cd plan"></i>'))+
       (weighed?'<i class="cd wt"></i>':'')+'</div></div>';
  }
  return '<div class="scrim" data-act="closebg"><div class="sheet"><div class="grab"></div>'+
    '<div class="cal-top">'+
      '<button class="cal-nav" data-act="calmove" data-n="-1">'+I.left+'</button>'+
      '<div class="cal-m">'+monthLabel(calMonth)+'</div>'+
      '<button class="cal-nav" data-act="calmove" data-n="1">'+I.right+'</button>'+
    '</div>'+
    '<div class="sh-body"><div class="cal-grid">'+g+'</div>'+
    '<div class="cal-key"><span><i class="cd log"></i>Logged</span>'+
      '<span><i class="cd plan"></i>Planned</span>'+
      '<span><i class="cd wt"></i>Weighed in</span></div>'+
    '<div class="row" style="margin:14px 0 6px">'+
      '<button class="cta soft" data-act="caltoday">Jump to today</button>'+
      '<button class="cta soft" data-act="close">Close</button></div></div></div></div>';
}
function infoHTML(){
  var e=EX[info],f=FORM[info]||{f:[],w:""};
  var h=f.f.map(function(x){return '<li>'+x+'</li>';}).join("");
  return '<div class="scrim" data-act="closebg"><div class="sheet"><div class="grab"></div>'+
    '<div class="sh-body"><div class="inf-top">'+
      '<div class="inf-gly">'+glyph(info)+'</div>'+
      '<div><div class="inf-n">'+e.n+'</div>'+
      '<div class="inf-t">'+exTarget(info)+' \u00b7 '+e.cat+'</div></div></div>'+
    '<div class="lbl"><span>What to focus on</span></div>'+
    '<ul class="inf-list">'+h+'</ul>'+
    (f.w?'<div class="lbl"><span>The fault that shows up most</span></div>'+
      '<div class="inf-warn">'+f.w+'</div>':'')+
    (e.k==="hold"&&e.goal?'<div class="lbl"><span>Next step</span></div><div class="card pad"><div class="prose">'+
      'Hold <b>'+e.goal+'s</b> cleanly on two separate sessions, then move to <b>'+e.prog+'</b>. '+
      'Your best so far is '+(best(info)||0)+'s.</div></div>':'')+
    '<div style="height:8px"></div><button class="cta soft" data-act="close">Close</button>'+
    '<div style="height:20px"></div></div></div></div>';
}
function renderLayer(){
  var L=document.getElementById("layer");
  if(dial){L.innerHTML=dialHTML();return;}
  if(sheet==="cal"){L.innerHTML=calHTML();return;}
  if(info){L.innerHTML=infoHTML();return;}
  if(sheet==="pick"){
    L.innerHTML='<div class="scrim" data-act="closebg"><div class="sheet"><div class="grab"></div>'+
      '<div class="sh-head"><div class="sh-title">Add to <span>'+SESSIONS[pickFor].name+'</span></div>'+
      '<div class="sh-in"><input id="pq" placeholder="Search exercises" autocomplete="off">'+
      '<button class="sh-done" data-act="close">Done</button></div></div>'+
      '<div class="sh-body" id="pb">'+pickList("")+'</div></div></div>';
    document.getElementById("pq").addEventListener("input",function(){
      document.getElementById("pb").innerHTML=pickList(this.value);});
    return;
  }
  L.innerHTML="";
}

/* ============ render ============ */
function renderNav(){
  var t=[["today","Today",I.today],["plan","Plan",I.plan],["trends","Trends",I.trend],["guide","Guide",I.book]],h='<div class="nav-in">';
  t.forEach(function(x){h+='<button class="nb'+(tab===x[0]?" on":"")+'" data-act="tab" data-t="'+x[0]+'">'+
    x[2]+'<span>'+x[1]+'</span></button>';});
  document.getElementById("nav").innerHTML=h+'</div>';
}
function render(){
  renderNav();
  document.getElementById("app").innerHTML =
    tab==="today"?viewToday():tab==="plan"?viewPlan():tab==="trends"?viewTrends():viewGuide();
  var s=document.getElementById("ss");
  if(s)s.addEventListener("change",function(){viewType=this.value;log={};render();});
  renderLayer();
}

/* ============ timer ============ */
function stopTimer(){if(tId){clearInterval(tId);tId=null;}tRun=false;}
function tickDial(){
  if(!dial)return;
  var n=document.getElementById("dnum"),arc=document.getElementById("darc"),btn=document.getElementById("dbtn");
  if(!n||!arc){renderLayer();return;}
  var e=EX[dial],goal=e.goal||30,C=2*Math.PI*104;
  var frac=tMode==="hold"?Math.min(1,tVal/goal):(restLen?tVal/restLen:0);
  arc.setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(1));
  if(tMode==="hold"){
    arc.classList.toggle("over",tVal>=goal);
    n.textContent=tVal.toFixed(1);
    if(btn)btn.textContent="Stop and log "+tVal.toFixed(1)+"s";
  }else{
    n.textContent=Math.floor(tVal/60)+":"+String(Math.floor(tVal%60)).padStart(2,"0");
  }
  if(!tRun)n.classList.remove("pulse");
}
function startHold(){stopTimer();tVal=0;tRun=true;renderLayer();
  var t0=Date.now();
  tId=setInterval(function(){tVal=Math.round((Date.now()-t0)/100)/10;tickDial();},100);}
function startRest(sec){stopTimer();restLen=sec;tVal=sec;tRun=true;renderLayer();
  var end=Date.now()+sec*1000;
  tId=setInterval(function(){
    tVal=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(tVal<=0){stopTimer();if(navigator.vibrate)navigator.vibrate([140,90,140]);}
    tickDial();},250);}

/* ============ events ============ */
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.ex&&t.dataset.f){
    t.value=t.value.replace(/[^\d.]/g,"");
    var a=log[t.dataset.ex];if(a&&a[t.dataset.i])a[t.dataset.i][t.dataset.f]=t.value;
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.sched!==undefined){
    var i=+t.dataset.sched;
    if(t.value===WEEK[i])delete S.schedule[i];else S.schedule[i]=t.value;
    saveState();
    if(i===selDow())viewType=null;
    render();toast(DAY[i]+" now defaults to "+SESSIONS[t.value].name.toLowerCase());
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,id=b.dataset.ex,ty=b.dataset.t,L;

  if(a==="tab"){tab=ty;render();window.scrollTo(0,0);}
  else if(a==="day"){selDate=b.dataset.d;viewType=null;log={};render();window.scrollTo(0,0);}
  else if(a==="gotoday"){selDate=today();calMonth=null;viewType=null;log={};render();window.scrollTo(0,0);}
  else if(a==="openday"){openDay=(openDay===+b.dataset.d)?null:+b.dataset.d;render();}
  else if(a==="setdefault"){
    var d=selDow(),v=curType();
    if(v===WEEK[d])delete S.schedule[d];else S.schedule[d]=v;
    saveState();viewType=null;render();toast(DAY[d]+" now defaults to "+SESSIONS[v].name.toLowerCase());
  }
  else if(a==="addset"){log[id]=log[id]||[];log[id].push(newSet(id));render();}
  else if(a==="inc"||a==="dec"){
    var arr=log[id],ix=+b.dataset.i;
    if(!arr||!arr[ix])return;
    var cur=parseFloat(arr[ix].v);
    if(isNaN(cur))cur=parseFloat(planVal(id))||0;
    var nv=Math.max(0,Math.round((cur+(a==="inc"?1:-1))*10)/10);
    arr[ix].v=String(nv);
    var inp=document.querySelector('input[data-ex="'+id+'"][data-i="'+ix+'"][data-f="v"]');
    if(inp)inp.value=arr[ix].v;else render();
  }
  else if(a==="delset"){log[id].splice(+b.dataset.i,1);render();}
  else if(a==="open"){pickFor=ty;sheet="pick";renderLayer();}
  else if(a==="info"){info=id;renderLayer();}
  else if(a==="opencal"){calMonth=selDate;sheet="cal";renderLayer();}
  else if(a==="calmove"){calMonth=monthShift(calMonth,+b.dataset.n);renderLayer();}
  else if(a==="calpick"){selDate=b.dataset.d;viewType=null;log={};sheet=null;render();window.scrollTo(0,0);}
  else if(a==="caltoday"){selDate=today();calMonth=today();viewType=null;log={};sheet=null;render();window.scrollTo(0,0);}
  else if(a==="dial"){dial=id;tMode="hold";tVal=0;stopTimer();renderLayer();}
  else if(a==="mode"){tMode=b.dataset.m;stopTimer();tVal=0;renderLayer();}
  else if(a==="starthold"){startHold();}
  else if(a==="stophold"){
    stopTimer();var held=tVal;
    if(held>0){log[dial]=log[dial]||[];log[dial].push({v:String(Math.round(held))});}
    dial=null;render();toast("Logged "+held.toFixed(1)+"s");
  }
  else if(a==="rest"){startRest(+b.dataset.s);}
  else if(a==="close"||(a==="closebg"&&e.target.classList.contains("scrim"))){
    stopTimer();sheet=null;dial=null;info=null;pickFor=null;render();
  }
  else if(a==="pick"){
    L=list(pickFor);var at=L.indexOf(id);
    if(at>=0){L.splice(at,1);delete log[id];}else L.push(id);
    setList(pickFor,L);
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);
  }
  else if(a==="rmex"){L=list(ty);L.splice(L.indexOf(id),1);setList(ty,L);delete log[id];render();}
  else if(a==="up"||a==="down"){
    L=list(ty);var i=L.indexOf(id),j=a==="up"?i-1:i+1;
    if(j>=0&&j<L.length){var tmp=L[i];L[i]=L[j];L[j]=tmp;setList(ty,L);render();}
  }
  else if(a==="resetex"){delete S.templates[ty];saveState();log={};render();toast("Exercises reset to default");}
  else if(a==="resetsched"){S.schedule={};saveState();viewType=null;render();toast("Schedule reset to default");}
  else if(a==="applysug"){
    var sg=suggest(id);
    if(!sg||!sg.newT){toast("Nothing to apply");return;}
    S.targets[id]=sg.newT;saveState();render();toast(EX[id].n+" target is now "+sg.newT);
  }
  else if(a==="resettargets"){S.targets={};saveState();render();toast("All targets back to the original plan");}
  else if(a==="copysum"){
    var sm=document.getElementById("sum");sm.select();sm.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("Summary copied");}catch(err){toast("Select the text and copy it");}
  }
  else if(a==="savefood"){
    var g=function(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v;};
    var kc=g("kIn"),pv=g("pIn"),cv=g("cIn"),fv=g("fIn");
    if(kc===null&&pv===null&&cv===null&&fv===null){toast("Fill in at least one figure");return;}
    setNut(selDate,kc,pv,cv,fv);
    saveState();render();toast("Food saved");
  }
  else if(a==="savew"){
    var v=parseFloat(document.getElementById("wIn").value);
    if(!v||v<40||v>200){toast("Enter a weight in kilos");return;}
    S.weights=S.weights.filter(function(x){return x.d!==today();});
    S.weights.push({d:today(),kg:v});
    S.weights.sort(function(x,y){return x.d<y.d?-1:1;});
    saveState();render();toast("Weight saved");
  }
  else if(a==="save"){
    var ex={},n=0;
    for(var k in log){var c=log[k].filter(function(s){return s.v!=="";});if(c.length){ex[k]=c;n++;}}
    if(!n){toast("Add a set first");return;}
    S.sessions.push({id:Date.now(),d:selDate,type:curType(),ex:ex});
    saveState();log={};render();toast("Session saved");
  }
  else if(a==="copy"){
    var io=document.getElementById("io");io.select();io.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("Backup copied");}catch(err){toast("Select the text and copy it");}
  }
  else if(a==="restore"){
    var io2=document.getElementById("io");io2.readOnly=false;
    try{var p=JSON.parse(io2.value);
      if(!p.weights&&!p.sessions){toast("That is not a backup");return;}
      S.weights=p.weights||[];S.sessions=p.sessions||[];S.templates=p.templates||{};
      S.schedule=p.schedule||{};S.targets=p.targets||{};S.nutrition=p.nutrition||[];
      saveState();viewType=null;render();toast("Restored");
    }catch(err){toast("Paste a backup into the box first");}
  }
});

/* ============ manifest ============ */
(function(){
  var ic="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%232450FF'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='42' stroke-linecap='round'%3E%3Cpath d='M313 159 A97 97 0 1 0 313 353'/%3E%3Cpath d='M233 256 H395'/%3E%3C/g%3E%3C/svg%3E";
  var mf={name:"Calisthenics",short_name:"Calisthenics",start_url:".",display:"standalone",
    background_color:"#E8ECF1",theme_color:"#E8ECF1",
    icons:[{src:ic,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
  try{var l=document.createElement("link");l.rel="manifest";
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
    document.head.appendChild(l);}catch(e){}
})();

loadState();
selDate=today();calMonth=today();
var handoff=readParams();
render();
if(handoff)toast(handoff);
</script>
