  if(FAMOF[id]&&clearInfo(id))return famMeter(id);
  if(STD[id]&&stdVal(id)!==null)return stdMeter(id);
  if(FAMOF[id])return famSupport(id);
  var e=EX[id],b=best(id),p=Math.min(100,b/e.goal*100),done=b>=e.goal;
  return '<div class="meter"><div class="meter-top">'+
    '<span class="meter-v num">'+(b>0?b+"s best":"Not logged yet")+'</span>'+
    '<span class="meter-g">'+e.goal+'s → '+e.prog+'</span></div>'+
    '<div class="track"><div class="fill'+(done?" done":"")+'" style="width:'+p+'%"></div></div>'+
    (done?'<div class="meter-msg">Threshold reached. Hold 3 × '+e.goal+'s cleanly on two separate sessions, then step up.</div>':'')+
    '</div>';

/* ---- targets and progression ---- */
function exTarget(id){return S.targets[id]||EX[id].t;}
function planRange(id){
  var t=exTarget(id),m=t.match(/×\s*(\d+(?:\.\d+)?)(?:\s*[–-]\s*(\d+(?:\.\d+)?))?/);
  if(!m)m=t.match(/(\d+(?:\.\d+)?)(?:\s*[–-]\s*(\d+(?:\.\d+)?))?/);
  if(!m)return null;
  return {lo:parseFloat(m[1]),hi:m[2]?parseFloat(m[2]):parseFloat(m[1])};
}
function planVal(id){var r=planRange(id);return r?String(r.lo):"";}
function planKg(id){var m=exTarget(id).match(/(?:\+|·\s*)(\d+(?:\.\d+)?)\s*kg/);return m?m[1]:"";}
function loadStep(id){var c=EX[id].cat;return (c==="Legs"||c==="Gym legs")?5:2.5;}

/* one entry per training day, best of that day, newest first.
   Saving twice in a day must not look like two sessions. */
function history(id,days){
  var byDay={};
  S.sessions.forEach(function(s){
    var a=(s.ex||{})[id];if(!a)return;
    var g=ago(s.d);if(g<0||g>days)return;
    var v=Math.max.apply(null,a.map(function(x){return parseFloat(x.v)||0;}));
    var kg=Math.max.apply(null,a.map(function(x){return parseFloat(x.kg)||0;}));
    var e=byDay[s.d];
    if(!e)byDay[s.d]={d:s.d,g:g,v:v,kg:kg,n:a.length};
    else{if(v>e.v)e.v=v;if(kg>e.kg)e.kg=kg;e.n+=a.length;}
  });
  var out=[];for(var d in byDay)out.push(byDay[d]);
  out.sort(function(x,y){return x.g-y.g;});
  return out;
}
function suggest(id){
  var e=EX[id],h=history(id,42),r=planRange(id);
  if(!r||e.k==="mins")return null;

  /* clearing a level is a fact about what you held, not about how many weeks
     of history exist — so this runs before any window-based check */
  if(FAMOF[id]){
    var f0=FAM[FAMOF[id]],fr0=famRank(FAMOF[id]),ci0=clearInfo(id);
    if(ci0&&ci0.confirmed&&fr0.next&&(fr0.next.id!==id||fr0.next.u!==ci0.u))
      return {kind:"swap",head:fr0.next.id===id?"Push the load on "+EX[id].n:"Move up to "+EX[fr0.next.id].n,
        body:"You have reached "+valFmt(ci0.u,ci0.best)+" on "+e.n.toLowerCase()+", past the "+
             stepFmt(ci0.st)+" that ends this stage. More of the same will not move your "+f0.n.toLowerCase()+
             " along — "+(fr0.next.id===id?"load will.":EX[fr0.next.id].n.toLowerCase()+" will.")+
             " Expect the number to drop, and that is the point.",
        swap:fr0.next.id};
  }

  if(h.length<2)return null;
  var recent=h.slice(0,3),older=h.slice(3,6),t=exTarget(id);
  var bestR=Math.max.apply(null,recent.map(function(x){return x.v;}));
  var rec2=h.slice(0,2),old3=h.slice(2,5);
  if(old3.length>=2){
    var bestN=Math.max.apply(null,rec2.map(function(x){return x.v;}));
    var bestO=Math.max.apply(null,old3.map(function(x){return x.v;}));
    if(bestO>0&&bestN<bestO*0.85)
      return {kind:"steady",head:"Hold the target where it is",
        body:"Your best has slipped from "+bestO+" to "+bestN+" over the last few weeks. Look at sleep, food, and whether this sits too close to another hard day."};
  }
  if(e.k==="hold"){
    if(FAMOF[id])return null;
    var goal=e.goal||30,hits=recent.filter(function(x){return x.v>=goal;}).length;
    if(hits>=2)return {kind:"step",head:"Ready to step up",
      body:"You held "+goal+"s or more in "+hits+" of the last "+recent.length+" sessions. Move to "+e.prog+" and expect the numbers to drop. That is the point."};
    return null;
  }
  if(e.k==="load"){
    var st=loadStep(id),pk=parseFloat(planKg(id)),named=!isNaN(pk);
    var lifted=Math.max.apply(null,recent.map(function(x){return x.kg;}));
    var base=named?pk:lifted;
    if(!base)return null;
    var strong=recent.filter(function(x){return x.v>=r.hi&&x.kg>=base;}).length;
    if(strong>=2){
      var nk=base+st;
      return {kind:"load",head:"Add "+st+" kg",
        body:"You hit "+r.hi+" reps at "+base+" kg in "+strong+" of the last "+recent.length+" sessions. Move to "+nk+" kg and let the reps come back down.",
        newT:named?t.replace(/(?:\+|·\s*)\d+(?:\.\d+)?\s*kg/,"· "+nk+" kg"):t+" · "+nk+" kg"};
    }
    return null;
  }
  var hitTop=recent.filter(function(x){return x.v>=r.hi;}).length;
  if(hitTop>=2){
    if(bestR>=r.hi*1.5)
      return {kind:"form",head:"This has got too easy",
        body:"You are doing "+bestR+" reps against a target of "+r.hi+". More reps stops building much strength here. Move to a harder variation or add load instead."};
    var lo=r.lo+2,hi=r.hi+2,band=(r.lo===r.hi)?String(hi):lo+"–"+hi;
    return {kind:"reps",head:"Raise the target to "+band,
      body:"You reached "+r.hi+" reps in "+hitTop+" of the last "+recent.length+" sessions. Push the target up and keep the same form standard.",
      newT:t.replace(/×\s*\d+(?:\.\d+)?(?:\s*[–-]\s*\d+(?:\.\d+)?)?/,"× "+band)};
  }
  return null;
}
function allSuggestions(type){
  var L=list(type),out=[],pick={};
  L.forEach(function(id){
    if(!EX[id])return;
    var s=suggest(id);if(!s)return;
    if(S.hidden[id+"|"+s.kind]===s.head)return;    /* put away by hand */
    if(s.kind==="swap"){
      if(L.indexOf(s.swap)>=0)return;              /* already in the plan */
      var key=FAMOF[id],step=-1;
      FAM[key].steps.forEach(function(st,j){if(st.id===id)step=j;});
      if(!pick[key]||step>pick[key].step)pick[key]={id:id,s:s,step:step};
      return;                                      /* one swap per skill, the furthest along */
    }
    out.push({id:id,s:s});
  });
  for(var k in pick)out.unshift({id:pick[k].id,s:pick[k].s});
  return out;
}
function newSet(id){
  var e=EX[id],a=log[id]||[],prev=a.length?a[a.length-1]:null;
  if(prev)return e.k==="load"?{v:prev.v,kg:prev.kg}:{v:prev.v};
  return e.k==="load"?{v:planVal(id),kg:planKg(id)}:{v:planVal(id)};

/* ============ nutrition ============ */
var DEF_PLO=130,DEF_PHI=140,FAT_LO=70,FAT_HI=85;
/* carbs are whatever is left once protein and fat are covered */
function carbTarget(){return Math.round((gKcal()-((gPLo()+gPHi())/2)*4-((FAT_LO+FAT_HI)/2)*9)/4/10)*10;}
function kcalFromMacros(n){
  if(!n||n.p==null||n.c==null||n.f==null)return null;
  return Math.round(n.p*4+n.c*4+n.f*9);
}
function nutOn(d){var r=null;S.nutrition.forEach(function(x){if(x.d===d)r=x;});return r;}
function nutAvg(days,f){
  var v=S.nutrition.filter(function(x){var g=ago(x.d);return g>=0&&g<days&&x[f]!=null;});
  return v.length?v.reduce(function(a,x){return a+x[f];},0)/v.length:null;
}
function nutRange(a,b,f){
  var v=S.nutrition.filter(function(x){return x.d>=a&&x.d<=b&&x[f]!=null;});
  return v.length?v.reduce(function(s,x){return s+x[f];},0)/v.length:null;
}
function setNut(d,kcal,pr,cb,ft){
  var prev=nutOn(d)||{};
  S.nutrition=S.nutrition.filter(function(x){return x.d!==d;});
  var o={d:d};
  [["kcal",kcal],["p",pr],["c",cb],["f",ft]].forEach(function(pair){
    var k=pair[0],v=pair[1];
    if(v!=null&&!isNaN(v))o[k]=Math.round(v);
    else if(prev[k]!=null)o[k]=prev[k];
  });
  if(o.kcal!=null||o.p!=null||o.c!=null||o.f!=null)S.nutrition.push(o);
  S.nutrition.sort(function(x,y){return x.d<y.d?-1:1;});
}
/* rough: a kilo of gained tissue treated as about 7700 kcal */
function intakeAdvice(){
  var r=rate(),k=nutAvg(10,"kcal");
  if(r===null||k===null)return null;
  return {rate:r,avg:Math.round(k),target:Math.round((k-(r-0.3)*1100)/10)*10};
}
/* values handed over by a Shortcut: ?kcal=2870&p=138&w=79.4&d=2026-08-11 */
function readParams(){
  if(typeof location==="undefined"||!location.search)return null;
  try{
    var q=new URLSearchParams(location.search),got=[];
    var d=q.get("d")||today();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=today();
    var kcal=parseFloat(q.get("kcal")),pr=parseFloat(q.get("p")),
        cb=parseFloat(q.get("c")),ft=parseFloat(q.get("f")),w=parseFloat(q.get("w"));
    if(!isNaN(kcal)||!isNaN(pr)||!isNaN(cb)||!isNaN(ft)){
      setNut(d,isNaN(kcal)?null:kcal,isNaN(pr)?null:pr,isNaN(cb)?null:cb,isNaN(ft)?null:ft);
      if(!isNaN(kcal))got.push(Math.round(kcal)+" kcal");
      var m=[];
      if(!isNaN(pr))m.push(Math.round(pr)+"P");
      if(!isNaN(cb))m.push(Math.round(cb)+"C");
      if(!isNaN(ft))m.push(Math.round(ft)+"F");
      if(m.length)got.push(m.join(" / ")+" g");
    }
    if(!isNaN(w)&&w>40&&w<200){
      S.weights=S.weights.filter(function(x){return x.d!==d;});
      S.weights.push({d:d,kg:w});
      S.weights.sort(function(x,y){return x.d<y.d?-1:1;});
      got.push(w.toFixed(1)+" kg");
    }
    if(got.length){
      saveState();
      if(typeof history!=="undefined"&&history.replaceState)history.replaceState(null,"",location.pathname);
      return "Logged "+got.join(", ")+(d===today()?"":" for "+fmtD(d));
    }
  }catch(e){}
  return null;
}

/* ============ trends ============ */
function wChart(){
  var p=S.weights.filter(function(x){return ago(x.d)<=90;});
  if(p.length<2)return '<div class="card"><div class="empty">Log two morning weights and the trend line appears here.</div></div>';
  var W=320,H=118,P=6;
  var xs=p.map(function(q){return -ago(q.d);});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs.concat([0]));
  var ys=p.map(function(q){return q.kg;});
  var y0=Math.min.apply(null,ys.concat([START]))-.7,y1=Math.max.apply(null,ys.concat([gTarget()]))+.7;
  var X=function(v){return P+((v-x0)/((x1-x0)||1))*(W-2*P);};
  var Y=function(v){return P+(1-(v-y0)/((y1-y0)||1))*(H-2*P);};
  var d="",c="";
  p.forEach(function(q,i){var x=X(-ago(q.d)).toFixed(1),y=Y(q.kg).toFixed(1);
    d+=(i?"L":"M")+x+" "+y+" ";c+='<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="#2450FF"/>';});
  var area="M"+X(x0).toFixed(1)+" "+H+" "+d.replace(/^M/,"L")+"L"+X(-ago(p[p.length-1].d)).toFixed(1)+" "+H+"Z";
  return '<div class="card pad chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:118px">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#2450FF" stop-opacity=".16"/><stop offset="1" stop-color="#2450FF" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<line x1="0" x2="'+W+'" y1="'+Y(gTarget())+'" y2="'+Y(gTarget())+'" stroke="#0E9F6E" stroke-width="1.4" stroke-dasharray="4 4"/>'+
    '<path d="'+d+'" fill="none" stroke="#2450FF" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+c+
    '</svg><div class="legend"><span><i class="sw" style="background:#2450FF"></i>Bodyweight</span>'+
    '<span><i class="sw" style="background:#0E9F6E"></i>'+gTarget()+' kg goal</span></div></div>';
}
function kChart(){
  var pts=S.nutrition.filter(function(x){return ago(x.d)<=30&&ago(x.d)>=0&&x.kcal!=null;});
  if(pts.length<3)return '<div class="card"><div class="empty">Log a few days of food and the pattern appears here.</div></div>';
  var W=320,H=104,P=6,n=pts.length;
  var vals=pts.map(function(x){return x.kcal;});
  var y0=Math.min.apply(null,vals.concat([gKcal()]))*0.92,y1=Math.max.apply(null,vals.concat([gKcal()]))*1.05;
  var bw=Math.max(3,(W-2*P)/Math.max(n,10)-3);
  var Y=function(v){return P+(1-(v-y0)/((y1-y0)||1))*(H-2*P);};
  var bars="";
  pts.forEach(function(x,i){
    var bx=P+i*((W-2*P)/Math.max(n,10)),by=Y(x.kcal);
    bars+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-P-by).toFixed(1)+

  return '<div class="card pad chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:104px">'+
    bars+'<line x1="0" x2="'+W+'" y1="'+Y(gKcal())+'" y2="'+Y(gKcal())+'" stroke="#0E9F6E" stroke-width="1.4" stroke-dasharray="4 4"/>'+
    '</svg><div class="legend"><span><i class="sw" style="background:#2450FF"></i>Daily intake</span>'+

}
function macroCard(){

function wkHolds(){
  var m={};
  S.sessions.forEach(function(s){var w=Math.floor(ago(s.d)/7);if(w>11||w<0)return;
    ["tuckP","tuckFL"].forEach(function(k){var a=(s.ex||{})[k];if(!a)return;
      var b=Math.max.apply(null,a.map(function(x){return parseFloat(x.v)||0;}));
      m[w]=m[w]||{};if(b>(m[w][k]||0))m[w][k]=b;});});
  return m;
}
function hChart(m){

function viewTrends(){
  var r=rate(),m=wkHolds();
  var cur=S.weights.length?S.weights[S.weights.length-1].kg:null;
  var l7=S.weights.filter(function(x){return ago(x.d)<=7;});
  var a7=l7.length?l7.reduce(function(a,x){return a+x.kg;},0)/l7.length:null;
  function tr(k){var a=[0,1].map(function(w){return m[w]&&m[w][k];}).filter(Boolean);
    var b=[2,3].map(function(w){return m[w]&&m[w][k];}).filter(Boolean);
    return (!a.length||!b.length)?null:Math.max.apply(null,a)-Math.max.apply(null,b);}
  var tp=tr("tuckP"),tf=tr("tuckFL"),f;

  else if(r>0.5)f={c:"warn",k:"Gaining fast",t:"About "+r.toFixed(2)+" kg a week. Above roughly 0.35 the extra is mostly fat. Consider trimming 150 kcal."};
  else if(r<0.05)f={c:"warn",k:"Stalled",t:"About "+r.toFixed(2)+" kg a week. If that holds for two more weeks, add 150 kcal."};
  else f={c:"ok",k:"On track",t:"About "+r.toFixed(2)+" kg a week, the range where most of the gain is muscle. Holds "+((tp<0||tf<0)?"are worth watching":"look fine")+"."};

  var kAvg=nutAvg(7,"kcal"),pAvg=nutAvg(7,"p"),adv=intakeAdvice();
  if(adv&&f.c!=="ok"&&r!==null){
    if(r>0.5)f={c:"bad",k:"Gaining too fast on "+adv.avg+" kcal",
      t:"About "+r.toFixed(2)+" kg a week while averaging "+adv.avg+" kcal. Around "+adv.target+
        " kcal should bring you to 0.3 kg a week. Rough estimate — recheck in two weeks."};
    else if(r<0.05)f={c:"warn",k:"Stalled on "+adv.avg+" kcal",
      t:"Barely moving while averaging "+adv.avg+" kcal. Around "+adv.target+
        " kcal should start it again. Rough estimate — recheck in two weeks."};
  }
  var togo=cur!==null?gTarget()-cur:null,eta=(r&&r>0.05&&togo>0)?Math.ceil(togo/r):null;
  var h='<div class="hdr">'+'<div class="eyebrow">Progress</div><div class="h1">'+
    (cur!==null?cur.toFixed(1)+' kg':'No weight yet')+'</div>'+
    '<div class="sub">'+(togo!==null&&togo>0?'Another '+togo.toFixed(1)+' kg to your '+gTarget()+' kg goal'+(eta?', about '+eta+' weeks away at this rate':'')+'.':'Log a morning weight to start the trend.')+'</div></div>'+
    '<div class="wrap"><div class="note '+f.c+'"><span class="note-k">'+f.k+'</span>'+f.t+'</div>'+
    '<div class="grid2">'+
      '<div class="stat"><div class="stat-k">7-day average</div><div class="stat-v num">'+(a7!==null?a7.toFixed(1):"—")+'<span class="u"> kg</span></div><div class="stat-s">Smooths daily noise</div></div>'+
      '<div class="stat"><div class="stat-k">Rate</div><div class="stat-v num">'+(r!==null?(r>0?"+":"")+r.toFixed(2):"—")+'</div><div class="stat-s">kg per week</div></div>'+
      '<div class="stat"><div class="stat-k">Tuck planche</div><div class="stat-v num">'+(best("tuckP")||"—")+'<span class="u">s</span></div><div class="stat-s">Best hold · 15s step</div></div>'+
      '<div class="stat"><div class="stat-k">Tuck front lever</div><div class="stat-v num">'+(best("tuckFL")||"—")+'<span class="u">s</span></div><div class="stat-s">Best hold · 15s step</div></div>'+
      '<div class="stat"><div class="stat-k">Calories</div><div class="stat-v num">'+(kAvg!==null?Math.round(kAvg):"—")+'</div><div class="stat-s">7-day average · target '+gKcal()+'</div></div>'+
      '<div class="stat"><div class="stat-k">Protein</div><div class="stat-v num">'+(pAvg!==null?Math.round(pAvg):"—")+'<span class="u"> g</span></div><div class="stat-s">7-day average · target '+gPLo()+'–'+gPHi()+'</div></div>'+
    '</div><div class="lbl"><span>Bodyweight</span></div>'+wChart()+

      h+='<div class="hrow"><div><div class="hname">'+(SESSIONS[s.type]?SESSIONS[s.type].name:s.type)+'</div>'+

/* ============ weekly review ============ */
function weekBounds(w){
  var n=new Date();n.setHours(0,0,0,0);
  var end=new Date(n);end.setDate(n.getDate()-n.getDay()-7*w+6);
  var st=new Date(end);st.setDate(end.getDate()-6);
  return {a:iso(st),b:iso(end),
    lab:st.getDate()+" "+MON[st.getMonth()]+" – "+end.getDate()+" "+MON[end.getMonth()]};
}
function weekReview(w){
  var b=weekBounds(w);
  var ss=S.sessions.filter(function(s){return s.d>=b.a&&s.d<=b.b;});
  var ws=S.weights.filter(function(x){return x.d>=b.a&&x.d<=b.b;});
  var avg=ws.length?ws.reduce(function(a,x){return a+x.kg;},0)/ws.length:null;
  var prev=w<11?(function(){var p=weekBounds(w+1);
    var q=S.weights.filter(function(x){return x.d>=p.a&&x.d<=p.b;});
    return q.length?q.reduce(function(a,x){return a+x.kg;},0)/q.length:null;})():null;
  var holds={};
  ss.forEach(function(s){for(var k in (s.ex||{})){ if(!EX[k]||EX[k].k!=="hold")continue;
    var m=Math.max.apply(null,s.ex[k].map(function(x){return parseFloat(x.v)||0;}));
    if(m>(holds[k]||0))holds[k]=m;}});
  return {b:b,n:ss.length,avg:avg,delta:(avg!==null&&prev!==null)?avg-prev:null,holds:holds,
    kcal:nutRange(b.a,b.b,"kcal"),prot:nutRange(b.a,b.b,"p"),
    carb:nutRange(b.a,b.b,"c"),fat:nutRange(b.a,b.b,"f"),

/* ============ timer ============ */
function stopTimer(){if(tId){clearInterval(tId);tId=null;}tRun=false;}
function tickDial(){
  if(!dial)return;
  var n=document.getElementById("dnum"),arc=document.getElementById("darc"),btn=document.getElementById("dbtn");
  if(!n||!arc){renderLayer();return;}
  var e=EX[dial],goal=e.goal||30,C=2*Math.PI*104;
  var frac=tMode==="hold"?Math.min(1,tVal/goal):(restLen?tVal/restLen:0);
  arc.setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(1));
  if(tMode==="hold"){
    arc.classList.toggle("over",tVal>=goal);
    n.textContent=tVal.toFixed(1);
    if(btn)btn.textContent="Stop and log "+tVal.toFixed(1)+"s";
  }else{
    n.textContent=Math.floor(tVal/60)+":"+String(Math.floor(tVal%60)).padStart(2,"0");
  }
  if(!tRun)n.classList.remove("pulse");
}
function startHold(){stopTimer();tVal=0;tRun=true;renderLayer();
  var t0=Date.now();
  tId=setInterval(function(){tVal=Math.round((Date.now()-t0)/100)/10;tickDial();},100);}
function startRest(sec){stopTimer();restLen=sec;tVal=sec;tRun=true;renderLayer();
  var end=Date.now()+sec*1000;
  tId=setInterval(function(){
    tVal=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(tVal<=0){stopTimer();if(navigator.vibrate)navigator.vibrate([140,90,140]);}
    tickDial();},250);}

    if(inp)inp.value=arr[ix].v;else render();
  }
  else if(a==="delset"){log[id].splice(+b.dataset.i,1);render();}
  else if(a==="open"){pickFor=ty;sheet="pick";renderLayer();}
  else if(a==="info"){info=id;renderLayer();}
  else if(a==="opencal"){calMonth=selDate;sheet="cal";renderLayer();}
  else if(a==="calmove"){calMonth=monthShift(calMonth,+b.dataset.n);renderLayer();}
  else if(a==="calpick"){selDate=b.dataset.d;viewType=null;log={};sheet=null;render();window.scrollTo(0,0);}
  else if(a==="caltoday"){selDate=today();calMonth=today();viewType=null;log={};sheet=null;render();window.scrollTo(0,0);}
  else if(a==="dial"){dial=id;tMode="hold";tVal=0;stopTimer();renderLayer();}
  else if(a==="mode"){tMode=b.dataset.m;stopTimer();tVal=0;renderLayer();}
  else if(a==="starthold"){startHold();}
  else if(a==="stophold"){
    stopTimer();var held=tVal;
    if(held>0){log[dial]=log[dial]||[];log[dial].push({v:String(Math.round(held))});}
    dial=null;render();toast("Logged "+held.toFixed(1)+"s");
  }
  else if(a==="rest"){startRest(+b.dataset.s);}
  else if(a==="close"||(a==="closebg"&&e.target.classList.contains("scrim"))){
    stopTimer();sheet=null;dial=null;info=null;pickFor=null;render();
  }
  else if(a==="filt"){
    var g=b.dataset.g,v=b.dataset.v,ix=pf[g].indexOf(v);
    if(ix>=0)pf[g].splice(ix,1);else pf[g].push(v);
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);
  }
  else if(a==="filtclear"){
    pf={m:[],q:[],e:[],k:[]};
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);
  }
  else if(a==="pick"){
    L=list(pickFor);var at=L.indexOf(id);
    if(at>=0){L.splice(at,1);delete log[id];}else L.push(id);
    setList(pickFor,L);
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);
  }
  else if(a==="rmex"){L=list(ty);L.splice(L.indexOf(id),1);setList(ty,L);delete log[id];render();}
  else if(a==="up"||a==="down"){
    L=list(ty);var i=L.indexOf(id),j=a==="up"?i-1:i+1;
    if(j>=0&&j<L.length){var tmp=L[i];L[i]=L[j];L[j]=tmp;setList(ty,L);render();}
  }
  else if(a==="resetex"){delete S.templates[ty];saveState();log={};render();toast("Exercises reset to default");}
  else if(a==="savegoals"){
    var gv=function(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v;};
    var w=gv("gW"),k=gv("gK"),p1=gv("gP1"),p2=gv("gP2"),changed=0;
    if(w!==null){if(w<40||w>200){toast("Goal weight looks wrong");return;}S.goals.target=w;changed++;}
    if(k!==null){if(k<1200||k>6000){toast("Calorie target looks wrong");return;}S.goals.kcal=Math.round(k);changed++;}
    if(p1!==null){S.goals.plo=Math.round(p1);changed++;}
    if(p2!==null){S.goals.phi=Math.round(p2);changed++;}
    if(S.goals.plo&&S.goals.phi&&S.goals.plo>S.goals.phi){var t2=S.goals.plo;S.goals.plo=S.goals.phi;S.goals.phi=t2;}
    if(!changed){toast("Fill in at least one goal");return;}
    saveState();render();toast("Goals saved");
  }
  else if(a==="resetgoals"){S.goals={};saveState();render();toast("Goals back to default");}
  else if(a==="resetsched"){S.schedule={};saveState();viewType=null;render();toast("Schedule reset to default");}
  else if(a==="applysug"){
    var sg=suggest(id);
    if(!sg||!sg.newT){toast("Nothing to apply");return;}
    S.targets[id]=sg.newT;saveState();render();toast(EX[id].n+" target is now "+sg.newT);
  }
  else if(a==="hidesug"){
    var sg2=suggest(id);
    if(sg2)S.hidden[id+"|"+sg2.kind]=sg2.head;
    saveState();render();toast("Put away until this changes");
  }
  else if(a==="applyswap"){
    var to=b.dataset.to,ty3=curType(),L3=list(ty3),ix3=L3.indexOf(id);
    if(ix3<0){toast("That is not in this session");return;}
    if(L3.indexOf(to)>=0)L3.splice(ix3,1); else L3[ix3]=to;
    setList(ty3,L3);
    /* anything already logged today still saves — it was real work */
    info=null;sheet=null;render();
    toast(EX[to].n+" swapped into "+SESSIONS[ty3].name.toLowerCase());
  }
  else if(a==="resettargets"){S.targets={};saveState();render();toast("All targets back to the original plan");}
  else if(a==="copysum"){
    var sm=document.getElementById("sum");sm.select();sm.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("Summary copied");}catch(err){toast("Select the text and copy it");}
  }
  else if(a==="savefood"){
    var g=function(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v;};
    var kc=g("kIn"),pv=g("pIn"),cv=g("cIn"),fv=g("fIn");
    if(kc===null&&pv===null&&cv===null&&fv===null){toast("Fill in at least one figure");return;}
    setNut(selDate,kc,pv,cv,fv);
    saveState();render();toast("Food saved");
  }
  else if(a==="savew"){
    var v=parseFloat(document.getElementById("wIn").value);
    if(!v||v<40||v>200){toast("Enter a weight in kilos");return;}
    S.weights=S.weights.filter(function(x){return x.d!==selDate;});
    S.weights.push({d:selDate,kg:v});
    S.weights.sort(function(x,y){return x.d<y.d?-1:1;});
    saveState();render();toast("Weight saved");
  }
  else if(a==="save"){
    var ex={},n=0;
    for(var k in log){var c=log[k].filter(function(s){return s.v!=="";});if(c.length){ex[k]=c;n++;}}
    if(!n){toast("Add a set first");return;}
    S.sessions.push({id:Date.now(),d:selDate,type:curType(),ex:ex});
    saveState();log={};render();toast("Session saved");
  }
  else if(a==="copy"){
    var io=document.getElementById("io");io.select();io.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("Backup copied");}catch(err){toast("Select the text and copy it");}
  }
  else if(a==="restore"){
    var io2=document.getElementById("io");io2.readOnly=false;
    try{var p=JSON.parse(io2.value);
      if(!p.weights&&!p.sessions){toast("That is not a backup");return;}
      S.weights=p.weights||[];S.sessions=p.sessions||[];S.templates=p.templates||{};
      S.schedule=p.schedule||{};S.targets=p.targets||{};S.nutrition=p.nutrition||[];S.goals=p.goals||{};S.hidden=p.hidden||{};
      saveState();viewType=null;render();toast("Restored");
    }catch(err){toast("Paste a backup into the box first");}
  }
});

  var ic="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%232450FF'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='42' stroke-linecap='round'%3E%3Cpath d='M313 159 A97 97 0 1 0 313 353'/%3E%3Cpath d='M233 256 H395'/%3E%3C/g%3E%3C/svg%3E";
  var mf={name:"Calisthenics",short_name:"Calisthenics",start_url:".",display:"standalone",
    background_color:"#E8ECF1",theme_color:"#E8ECF1",
    icons:[{src:ic,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
  try{var l=document.createElement("link");l.rel="manifest";
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
    document.head.appendChild(l);}catch(e){}

loadState();
selDate=today();calMonth=today();
var handoff=readParams();
render();
if(handoff)toast(handoff);
</script>
