 dragonFlag:{f:["Anchor at the shoulders, not the neck.","Body one rigid line lowering slowly.","Tuck the knees to regress."],w:"Piking at the hips halfway down."},
 toesBar:{f:["Control the swing before adding reps.","Compress from the abs, not momentum.","Lower with control rather than dropping."],w:"Swinging into every rep."},
 abWheel:{f:["Start from the knees, ribs down throughout.","Only roll as far as you can keep the back flat.","Pull back with the abs, not the arms."],w:"Arching the lower back at full extension."},
 plank:{f:["Elbows under shoulders, body one line.","Squeeze glutes, tuck the pelvis slightly.","Quality over duration."],w:"Sagging hips, which loads the lower back instead of the abs."},

 squat:{"f":["Brace the trunk and keep the whole foot planted.","Let knees follow the toes and descend to a repeatable depth that your balance and mobility allow.","Stand up under control; use rack safeties for loaded work and reset your breath between reps."],"w":"Adding load while losing foot pressure, balance or consistent depth."},
 frontSq:{f:["Elbows high, bar resting on the front delts.","Stay upright, knees forward.","Depth comes from ankle and hip mobility."],w:"Elbows dropping, which dumps the bar forward."},
 rdl:{f:["Push the hips back, bar stays against the legs.","Slight knee bend, back flat throughout.","Stop when the hamstrings run out of range."],w:"Turning it into a squat by bending the knees. It is a hinge."},
 bss:{"f":["Keep the front foot planted and use the rear foot for balance.","Let the front knee travel naturally in line with the toes.","Choose stride length and torso angle for a controlled, comfortable range; train both legs."],"w":"Pushing strongly off the rear foot or losing front-foot contact."},
 nordic:{f:["Anchor the heels, lower as slowly as you can.","Hands ready to catch you.","Push back up with the hands if needed."],w:"Piking at the hips to shorten the lever."},
 calf:{f:["Full range \u2014 deep stretch at the bottom, full extension at the top.","Pause a beat at the top.","Slow tempo beats heavy weight."],w:"Bouncing through short reps."},
 pistol:{f:["Sit back and down, other leg straight ahead.","Hold a counterweight to help balance.","Heel stays down."],w:"Collapsing at the bottom rather than controlling the descent."},
 lunge:{"f":["Step to a distance that lets both knees bend under control.","Keep the front foot planted and let the knee follow the toes.","Push back smoothly and train both sides evenly."],"w":"Forcing a vertical shin or using a stride length that makes balance and depth inconsistent."},
 hipThrust:{f:["Bar over the hips, shoulders on a bench.","Drive through the heels, full lockout at the top.","Chin tucked, ribs down."],w:"Hyperextending the lower back at the top instead of finishing with the glutes."},

 invDL:{f:["From an inverted hang, hinge at the hips and let the legs lower while the torso stays put.","Arms locked, actively pull the bar toward your hips the whole time.","Squeeze the glutes hard at the top of each rep.","Keep the rings or bar close to your shins."],w:"Bending the elbows to control the descent, which removes the straight-arm work that transfers to the front lever."},
 invHang:{f:["Hips directly above the shoulders, body in one line.","Shoulders pulled down away from the ears.","Toes pointed, glutes squeezed \u2014 no banana shape."],w:"Hanging passively with the shoulders shrugged. Actively pull down or you are only training grip."},
 skinCat:{f:["Rotate slowly through the shoulders, knees tucked at first.","Go only as far as the shoulders allow, then return under control.","Excellent as a warm-up before any lever work."],w:"Dropping into the bottom position. The shoulder does not like being loaded at end range unexpectedly."},
 tuckFLpull:{f:["Hold a tuck front lever, then pull the bar to your chest without dropping the hips.","Elbows drive down and back, body stays horizontal.","Lower under control back to the lever line."],w:"Letting the hips sink as you pull, which turns it into a regular pull-up."},
 advFLpull:{"f":["Maintain an open tuck: both knees bent, hips away from the chest.","Bend the elbows to bring the chest toward the bar while keeping the hips horizontal.","Lower smoothly to straight arms; use a tighter tuck if the range shortens."],"w":"Extending one leg or dropping the hips to finish the pull."},
 strFLpull:{f:["Legs wide and straight, body horizontal at the start and finish.","Pull the bar toward the lower chest.","Only worth training once you hold a straddle lever for 8s or more."],w:"Attempting these before the straddle hold is solid. Build the hold first."},
 flRaise:{f:["From a dead hang, raise to the lever with straight arms only.","Initiate from the lats and the scapulae.","Tuck the knees to regress."],w:"Kipping the legs up. If you need momentum, use a shorter lever."},
 iceCream:{f:["From a front lever, lean back and pull to the top of a pull-up, then return to the lever.","Keep the body one line the whole way.","Slow and deliberate \u2014 this is a control exercise."],w:"Piking at the hip during the transition."},
 blPullout:{f:["From an inverted hang, lower toward the back lever and pull straight back up.","Straight arms, tucked knees at first.","Small range at the start."],w:"Going too deep too soon. The biceps tendon is the limiter here."},
 oaFL:{f:["Tuck tight, one arm on the bar, the other free or lightly assisting.","Expect heavy rotation \u2014 fight it with the obliques.","Very short holds, both sides evenly."],w:"Attempting it before a clean full front lever. This is a late-stage progression."},

 frogStand:{f:["Hands shoulder-width, fingers spread and gripping the floor.","Knees rest on the upper arms, weight shifts forward over the hands.","Look slightly ahead, not down at your hands."],w:"Not leaning far enough forward, so you keep tipping back onto the feet."},
 elbowLever:{f:["Elbows dig into the lower ribs or hip crease.","Lean forward until the feet float, body one line.","Wrists and elbows warm before attempting."],w:"Placing the elbows too high on the abdomen, which makes the balance point impossible to find."},
 tuckPpu:{f:["From a tuck planche, bend and press without losing the protraction.","Tiny range at first \u2014 a few centimetres is a real rep.","Hips stay at shoulder height throughout."],w:"Dropping the hips to make the press easier."},
 maltLean:{f:["Arms wider than planche, leaning further forward still.","Elbows locked, shoulders open.","Very short holds \u2014 this loads the biceps tendon hard."],w:"Training this before a solid straddle planche. It is a late progression, not a shortcut."},
 deg90:{"f":["Begin in a controlled handstand, then lower toward a horizontal bent-arm planche.","Keep the elbows bent near 90 degrees at the bottom and the body under control.","Press back to handstand; use assisted partials and practise the exit before full attempts."],"w":"Logging a static bent-arm lean as a complete 90-degree push-up. The full rep includes the return to handstand."},
 hsShrug:{f:["In a wall handstand, push tall and let the shoulders sink, then push again.","Small range, driven entirely by the scapulae.","Builds the overhead push you need for HSPU."],w:"Bending the elbows. This is a scapular movement, not a press."},

 koreanDip:{f:["Hands behind you on the bar, supinated grip.","Lower until the elbows reach about 90 degrees, hips travel under the bar.","Warm the shoulders and wrists thoroughly first."],w:"Going deep on cold shoulders. This is an extreme extension position."},
 russianDip:{"f":["On stable parallel bars, lower into a dip and shift back onto the forearms under control.","Shift forward to bring the elbows off the bars, then press to support.","Practise assisted transitions before linking complete reps."],"w":"Dropping onto the forearms instead of controlling the transition."},
 bulgDip:{"f":["Start in ring support and gradually let the elbows and rings move outward as you descend.","Maintain control of the rings and use a shallow range while learning the wider position.","Press back to support without the shoulders collapsing; build ordinary ring dips first."],"w":"Keeping the rings pinned to the ribs describes a regular ring dip. Do not force a wide or deep Bulgarian dip before you control it."},
 impDip:{"f":["On stable parallel bars, start in support and bend the elbows as you lean back.","Lower under control toward the forearms, then press back through the same path.","This is an advanced triceps skill: learn supported partials with appropriate coaching."],"w":"Treating it as a straight-arm lean. An impossible dip requires deep elbow flexion and a controlled return."},

 ctwHS:{"f":["Walk toward the wall only as far as you can safely reverse.","Use light toe contact, push tall and keep the ribs over the pelvis.","Breathe steadily; the chest does not need to press against the wall."],"w":"Moving the hands so close that you cannot come down safely."},
 headstandH:{f:["Tripod base: head and both hands form a triangle.","Most of the weight goes through the hands, not the head.","Stack the hips over the shoulders."],w:"Loading the neck. If your neck is taking the weight, come down."},
 hsTaps:{f:["Chest to wall, shift weight fully onto one hand, tap the opposite shoulder.","Straight arms, small controlled shifts.","Work up to long unbroken sets."],w:"Rushing the shift and collapsing to the other side."},
 hsHeel:{f:["From a wall handstand, pull the heels off the wall and find balance.","Hold for a second, then touch back.","This is the bridge from wall to freestanding."],w:"Pushing off the wall hard instead of pulling gently into balance."},
 tuckHS:{f:["From a handstand, tuck the knees to the chest and hold balance.","Push tall through the shoulders as the legs move.","Teaches you to balance while the shape changes."],w:"Letting the shoulders sink as the legs tuck."},
 straddleHS:{"f":["Open the legs symmetrically while keeping the hips above the shoulders.","Push tall and use finger pressure to manage balance.","Keep both legs active; a straddle changes balance demands and may feel easier or harder for you."],"w":"Opening the legs unevenly or letting the shoulders collapse."},
 hsWalk:{f:["Hold 10 seconds freestanding before you try walking.","Shift weight fully to one hand, take a small step, land under the shoulder.","Small steps beat big lunges."],w:"Walking before you can hold. Hold first, walk second."},
 hsPirouette:{f:["Shift onto one hand and turn the other hand out, then follow with the body.","Keep pushing tall through both shoulders.","Learn against the wall first."],w:"Piking to turn instead of shifting the weight."},
 pikePress:{f:["Straight legs, lean the shoulders forward over the hands.","Compression from the hip flexors lifts the feet, not a jump.","Elevate the feet to regress."],w:"Jumping into it. If the feet leave the floor by momentum, it is not a press."},
 straddlePress:{f:["Wide straddle lowers the centre of mass and shortens the lever.","Lean forward first, then lift \u2014 the order matters.","Keep the arms locked throughout."],w:"Trying to lift before shifting the weight over the hands."},

 falseGrip:{"f":["On rings, place the ring across the heel of the palm with the wrist above it.","Start with foot support and build short, controlled holds.","Maintain the grip during a low-ring transition drill before using it under full load."],"w":"Pushing through wrist pain or letting the wrist slip below the ring during the transition."},
 ringMU:{f:["False grip throughout, pull the rings to the chest.","Fast transition, keep the rings close to the body.","Finish with a clean support hold, turned out if you can."],w:"Losing the false grip at the transition and stalling at the bottom of the dip."},
 archerPull:{f:["Pull toward one hand while the other arm stays straight out to the side.","Keep the shoulders level, chin over the working hand.","Alternate sides evenly."],w:"Letting the straight arm bend and take half the load."},
 typewriter:{"f":["Pull the chin above the bar, then shift toward one hand while extending the other elbow.","Keep the working arm bent and your chin above the bar throughout the traverse.","Move slowly in both directions without using a leg swing."],"w":"Trying to straighten both arms while staying above the bar. One arm supports the pull as the other extends."},
 lsitPull:{f:["Hold a solid L-sit shape throughout the pull.","Legs stay level \u2014 do not let them drop as you pull.","Great combination of compression and pulling strength."],w:"Losing the L on the way down."},
 highPull:{f:["Explosive pull \u2014 aim to get the bar to your waist.","Full dead hang between reps, no bouncing.","Builds the power the strict muscle-up needs."],w:"Kipping. The whole point is generating speed from a dead start."},
 oaChinNeg:{f:["Start at the top with one arm, lower as slowly as you can.","Keep the shoulder packed down, do not let it ride up.","Both sides evenly, low volume."],w:"Dropping through the bottom half, which is the range that builds the strength."},
 hefesto:{"f":["This advanced behind-the-body pull uses a supinated grip and substantial shoulder extension.","Build supported partials and controlled entries with a qualified gymnastics or calisthenics coach.","Keep the movement slow and stop before you lose control of the elbows or shoulders."],"w":"Attempting a full unsupported negative before you can manage the shoulder range and return safely."},

 flagChamber:{f:["Both hands on the pole, top arm pulling and bottom arm pressing.","Knees tucked, hips stacked \u2014 no leg extension yet.","Build the press-pull balance before extending."],w:"Relying only on the top arm. The bottom arm press is half the movement."},
 tuckFlag:{f:["Top arm pulls down, bottom arm pushes up \u2014 both work equally.","Knees tucked tight, body turned so the hips face forward.","Squeeze the obliques hard."],w:"Letting the hips rotate so you end up half sideways. Square the hips."},
 strFlag:{f:["Legs wide and straight, body horizontal to the pole.","Maintain the press-pull tension the whole hold.","Straddle first, legs together much later."],w:"Piking at the hip to reduce the lever."},
 mannaH:{"f":["From a high supported V-sit, push the hips forward beyond the hands as the legs fold toward the torso.","Keep the arms straight and build shoulder extension and compression separately.","Use supported progressions; the full manna is an advanced gymnastics position."],"w":"Pushing the hips backward or forcing shoulder extension to manufacture height."},
 wipers:{f:["Hang with the legs raised, rotate side to side under control.","Straight arms, minimal swing.","Tuck the knees to regress."],w:"Using momentum to swing across rather than rotating with the obliques."},

 revNordic:{"f":["Kneel on padding and keep the hips extended as you lean backward.","Use a small controlled range or a band for assistance.","Return by extending the knees without folding at the hips."],"w":"Going beyond the range you can return from or forcing the movement through knee pain."},
 shrimp:{"f":["Balance on one leg and lower the rear knee toward the floor under control.","Let the torso lean and front knee travel naturally to stay balanced.","Use hand support or a smaller range while learning; practise both sides."],"w":"Dropping to the floor or twisting the pelvis to finish the rep."},
 wallWalk:{f:["Start in a push-up position with your feet against the wall.","Walk the feet up the wall while the hands step back toward it.","Finish chest-to-wall with the hands close in, then reverse under control.","Ribs down and glutes squeezed the whole way \u2014 do not let the back arch."],w:"Leaving the hands too far from the wall at the top, which forces a banana shape and defeats the point."},
 wristPU:{"f":["Begin kneeling with very light hand loading and a small comfortable wrist range.","For palm-lift wrist push-ups, keep the fingers on the floor while lifting and lowering the heel of the hand.","Back-of-hand and fingertip loading are separate advanced variations; progress them gradually."],"w":"Starting in a full push-up on the backs of the hands or pushing into wrist pain."},
 scapPush:{f:["Push-up position, arms locked the whole time.","Only the shoulder blades move \u2014 protract and retract.","Slow and deliberate, no elbow bend."],w:"Bending the elbows, which turns it into a partial push-up."},
 negPull:{f:["Jump or step to the top, then lower as slowly as you can.","Aim for five seconds, chest staying high.","Best builder when strict reps are still out of range."],w:"Dropping through the bottom half, which is where the strength is."},
 chinup:{f:["Supinated grip, shoulder width.","Full dead hang, chin clearly over the bar.","More biceps than a pull-up, so useful alongside straight-arm work."],w:"Cutting the range at the bottom."},
 widePull:{f:["Hands well outside shoulder width.","Pull the chest toward the bar, elbows down.","Expect fewer reps than a standard pull-up."],w:"Going so wide that the shoulder cannot move freely."},
 topHold:{f:["Hold at the top with the chin over the bar.","Elbows down and back, chest to the bar.","Builds the position you stall in on a strict muscle-up."],w:"Letting the chin drop slowly through the hold."},
 muTrans:{f:["Use a low bar so your feet can help.","Drill the turnover slowly, keeping the bar close.","Volume here beats grinding failed muscle-ups."],w:"Practising with the bar drifting away from the body."},
 invRow:{f:["Bar at hip height, body straight from head to heels.","Pull the chest to the bar, squeeze the blades.","Lower the bar to make it harder."],w:"Hips sagging so it becomes a partial row."},
 diamondPU:{"f":["Place the hands close under the chest at a comfortable wrist angle; the fingers do not have to touch.","Keep a controlled body line and let the elbows track naturally near the torso.","Lower and press through a repeatable range without bouncing."],"w":"Forcing a hand position that hurts the wrists or letting the hips sag."},
 widePU:{"f":["Place the hands moderately wider than your usual push-up position.","Keep the trunk controlled and lower through a comfortable shoulder range.","Use a width you can repeat without losing control at the bottom."],"w":"Going so wide that you cannot control the descent or keep the shoulders comfortable."},
 benchDip:{"f":["Use a stable bench with hands beside the hips and feet supporting part of your weight.","Keep the torso near the bench and lower only through a comfortable shoulder range.","Use more leg assistance or a different pressing exercise if the position is uncomfortable."],"w":"Forcing a deep shoulder stretch or pushing through pain to finish the set."},
 negDip:{"f":["Start at the top of stable parallel bars, using a step for assistance.","Lower slowly through a controlled, comfortable range without dropping onto the shoulders.","Place the feet back on the step and return to the top with assistance for the next negative."],"w":"Freefalling through the last part of the descent. Use more support or a smaller range."},
 hangLeg:{f:["Straight legs, raise to at least parallel.","Control the swing \u2014 start from a dead hang each rep.","Posterior pelvic tilt at the top."],w:"Swinging into every rep and calling it momentum."},
 kneeRaise:{f:["Knees to chest, no swing.","Curl the pelvis at the top rather than just lifting the thighs.","The regression for straight leg raises."],w:"Only lifting the knees without any pelvic tilt."},
 hollowRock:{f:["Lower back pressed flat, rock from the shoulders.","Small controlled rocking, no arching.","Stop the set when the back lifts off."],w:"Rocking from the hips with an arched back."},
 archHold:{f:["Face down, arms and legs lifted, squeezing the glutes.","The opposite of hollow \u2014 train both.","Look at the floor, not forward."],w:"Cranking the neck up, which is where the strain shows up."},
 pikeComp:{f:["Sit with straight legs, press the hands down and lift the heels.","Tiny lift is a real rep \u2014 compression strength is slow to build.","Essential for the V-sit and pressing to handstand."],w:"Bending the knees to get height."},
 boxJump:{f:["Land softly with bent knees, step down rather than jumping down.","Box height is not the point \u2014 landing quality is.","Keep it well away from heavy squat days."],w:"Jumping down and hammering the knees and achilles."},
 jumpSquat:{f:["Full squat, explode up, land soft.","Low reps, high quality.","Skip these the day before kickboxing."],w:"Grinding out high reps until the landing gets sloppy."},
 burpee:{f:["Chest to floor at the bottom, full stand at the top.","Keep a steady pace rather than sprinting the first ten.","Conditioning, not strength."],w:"Half push-ups at the bottom once fatigue sets in."},
 bearCrawl:{f:["Knees hovering just off the floor, back flat.","Opposite hand and foot move together.","Short distances, good as a warm-up."],w:"Hips bouncing up and down with every step."},

 machPress:{"f":["Set the seat so the handles line up around mid-chest.","Keep the torso supported and wrists aligned with the forearms.","Press and return through a comfortable range without bouncing."],"w":"Using a seat position that makes the handles too high relative to your chest."},
 machIncline:{f:["Handles should line up with your upper chest.","Same blade position \u2014 back and down.","Slightly lighter than flat, expect that."],w:"Shrugging the shoulders up to move more weight."},
 pecDeck:{f:["Slight bend in the elbows, held throughout.","Squeeze at the middle for a beat.","Moderate weight \u2014 this is a stretch and squeeze movement."],w:"Going too heavy and turning it into a press."},
 cableCross:{f:["Slight forward lean, arms in a wide arc.","Bring the handles together in front of the lower chest.","Control the return, do not let the stack pull you back."],w:"Bending the elbows to push more weight."},
 dbBench:{f:["Dumbbells at the lower chest, elbows around 45\u00b0.","Blades pinned, feet planted.","Great alongside dips \u2014 the free range suits shoulders doing planche work."],w:"Clashing the dumbbells together at the top and losing tension."},
 dbIncline:{f:["Bench at 30\u201345\u00b0, no steeper.","Press up and slightly back, not straight forward.","Upper chest bias, useful next to dips."],w:"Setting the bench too steep so it becomes a shoulder press."},
 dbFly:{f:["Soft elbows, fixed angle throughout.","Open only as far as you control.","Light weight, long tension."],w:"Dropping into a deep stretch with heavy dumbbells."},
 latPull:{f:["Grip just outside shoulder width, chest up.","Pull the bar to the collarbone, elbows down.","Control the return \u2014 do not let it yank you up."],w:"Leaning back and turning it into a row."},
 seatedRow:{f:["Chest up, torso still.","Pull to the lower ribs, squeeze the blades.","Full stretch at the front without rounding the back."],w:"Rocking backwards and forwards to move the stack."},
 chestRow:{"f":["Support the chest on the pad to reduce the need to hold a bent-over position.","Pull toward the ribs with a controlled torso and a natural elbow path.","Lower through a repeatable range without lifting the chest off the support."],"w":"Heaving away from the pad to finish a heavy rep."},
 dbRow:{f:["Flat back, one hand supported.","Pull to the hip, elbow close to the body.","Full stretch at the bottom."],w:"Twisting the torso to lift heavier."},
 machShoulder:{"f":["Adjust the seat so the handles start around shoulder height with comfortable wrists.","Brace the torso and press through a controlled range.","Allow the shoulder blades to rotate upward naturally as the arms rise."],"w":"Arching the back or forcing the shoulder blades down throughout an overhead press."},
 dbShoulder:{f:["Start at ear height, press up and slightly in.","Brace the midsection, glutes on.","Seated with back support if the lower back complains."],w:"Leaning back to turn it into an incline press."},
 cableLat:{f:["Cable from behind the body, lead with the elbow.","Stop at shoulder height.","Light weight and a slow lowering."],w:"Swinging the whole body to start each rep."},
 rearDelt:{"f":["Use a bent-over or chest-supported position with softly bent elbows.","Move the arms out to the sides while keeping the elbow angle consistent.","Allow natural shoulder-blade movement and lower the weight smoothly."],"w":"Swinging the torso or turning the movement into a bent-elbow row."},
 facePull:{"f":["Set the cable around face height and pull the rope toward the face.","Keep a controlled torso and rotate the forearms back only as far as comfortable.","Use a load that allows a smooth return without jerking."],"w":"Pulling with momentum or forcing shoulder rotation to reach an arbitrary end position."},
 tricepPush:{f:["Elbows pinned at the sides.","Full extension, slow return.","Keep the torso still."],w:"Leaning over the bar and turning it into a press."},
 hammerCurl:{f:["Neutral grip, elbows fixed.","Controlled lowering.","Kinder on the elbows than a supinated curl next to lever work."],w:"Swinging from the hips."},
 legPress:{f:["Feet mid-platform, shoulder width.","Lower until the knees reach about 90\u00b0, back flat on the pad.","Do not lock the knees hard at the top."],w:"Letting the lower back round off the pad at the bottom."},
 legExt:{f:["Pause a beat at the top.","Moderate weight, controlled lowering.","Useful accessory, not a squat replacement."],w:"Slamming into full extension with heavy weight."},
 seatCurl:{f:["Full range, pause at peak contraction.","Keep the hips down on the seat.","Good hamstring work alongside RDLs and kicking."],w:"Lifting the hips to finish the rep."},
 inclBB:{f:["Bench at 30\u201345\u00b0, no steeper.","Bar to the upper chest, elbows around 45\u00b0.","Blades pinned back and down throughout."],w:"Setting the bench too steep, which turns it into a shoulder press."},
 declBB:{f:["Slight decline is enough \u2014 steep adds nothing.","Bar to the lower chest.","Have a spotter or use safeties; getting out from under it is awkward."],w:"Bouncing the bar off the ribs."},
 machDecline:{f:["Handles line up below the chest.","Same blade position as any press \u2014 back and down.","Full lockout without rolling the shoulders forward."],w:"Setting the seat so high that it becomes a flat press."},
 dbDecline:{f:["Have someone hand you the dumbbells, or use your knees to kick them up.","Lower to the lower chest, elbows tucked.","Controlled \u2014 the getting-up part is the risky bit."],w:"Trying to sit up with heavy dumbbells still overhead."},
 inclFly:{f:["Soft elbows held at a fixed angle.","Open only as far as you control, squeeze back together.","Light weight, long tension."],w:"Going heavy and dropping into a deep stretch."},
 lowCable:{f:["Cables set low, arms sweep up and in.","Meet the handles at upper chest height.","Slight forward lean, chest proud."],w:"Turning it into a press by bending the elbows."},
 smithBench:{"f":["Position the bench so the fixed bar path suits a comfortable pressing range.","Set and test the safety stops before adding working weight.","Lower smoothly and press without bouncing or losing torso support."],"w":"Relying on the fixed track alone for safety or forcing a bar path that causes discomfort."},
 assistDip:{f:["Set the assistance so you finish the set with two reps left.","Forward lean for chest, upright for triceps.","Reduce the assistance over the weeks."],w:"Leaving the assistance the same for months."},
 cablePress:{f:["Split stance, brace the midsection.","Press straight out, squeeze at full extension.","Constant tension is the point \u2014 do not rest at lockout."],w:"Leaning the whole body into the press."},

 widePulldown:{f:["Hands well outside shoulder width.","Pull to the collarbone, elbows down and back.","Chest up, minimal lean."],w:"Pulling behind the neck, which loads the shoulder badly."},
 closePulldown:{f:["Narrow or V-grip, elbows tight to the ribs.","Pull to the sternum.","More lat stretch at the top than a wide grip."],w:"Rowing it with the whole torso."},
 neutralPulldown:{"f":["Use a palms-facing grip that feels comfortable at the wrists and elbows.","Pull toward the upper chest without swinging the torso.","Allow the shoulder blades to move naturally as the arms return overhead."],"w":"Forcing the shoulders down throughout the return or training through elbow pain."},
 machRow:{f:["Chest against the pad, feet planted.","Pull to the ribs, squeeze the blades at the back.","Full stretch at the front without letting the chest lift."],w:"Heaving with the lower back instead of the arms and back."},
 tbarRow:{f:["Hinge to about 45\u00b0, back flat.","Pull the handle to the stomach.","Chest-supported version if the lower back is loaded already."],w:"Standing up a little more with every rep."},
 bbRow:{f:["Torso around 45\u00b0, back flat and braced.","Pull to the lower ribs, elbows close.","Lower under control, no dropping."],w:"Using the hips to swing the bar up."},
 pendlay:{f:["Bar starts on the floor for every rep.","Torso stays parallel to the floor throughout.","Explosive pull, controlled return to the floor."],w:"Letting the torso rise as the set goes on."},
 assistPull:{f:["Set the assistance so the last rep is genuinely hard.","Full dead hang at the bottom, chin over the bar at the top.","Drop the assistance as you get stronger."],w:"Using so much assistance that the range gets sloppy."},
 cablePullover:{f:["Arms almost straight, sweep from overhead down to the thighs.","Drive from the lats, not the triceps.","Feel the stretch at the top."],w:"Bending the elbows and turning it into a pushdown."},
 deadlift:{f:["Bar over mid-foot, shins close, back flat.","Push the floor away rather than yanking the bar up.","Lock out with the glutes, not by leaning back."],w:"Rounding the lower back off the floor. Drop the weight before you drop the position."},
 rackPull:{f:["Bar set just below the knee.","Same brace and lockout as a deadlift.","Useful for loading the top half without full-range fatigue."],w:"Going far heavier than your deadlift and letting the back round."},
 shrug:{f:["Straight up and down, no rolling.","Pause a beat at the top.","Heavy is fine \u2014 range is short."],w:"Rolling the shoulders, which does nothing and irritates the joint."},

 seatedBBPress:{f:["Back supported, ribs down.","Bar starts at the chin, press up and slightly back.","Squeeze the glutes even seated."],w:"Arching the lower back to press more weight."},
 arnold:{f:["Start palms facing you, rotate out as you press.","Controlled rotation, no snapping.","Lighter than a straight press \u2014 expect that."],w:"Rushing the rotation and losing shoulder position."},
 machLat:{f:["Elbows against the pads, drive out and up.","Stop at shoulder height.","Constant tension throughout."],w:"Pushing with the hands instead of driving with the elbows."},
 revPecDeck:{"f":["Keep the chest supported and adjust the handles to a comfortable shoulder height.","Open the arms with a consistent soft elbow bend and natural shoulder-blade movement.","Return slowly without letting the stack pull you forward."],"w":"Lifting the chest off the support or jerking the arms to move the stack."},
 uprightRow:{"f":["Choose a comfortable grip around shoulder width or wider.","Raise the load only through a range your shoulders tolerate, usually with elbows no higher than shoulder level.","Keep the torso still and lower under control."],"w":"Forcing a narrow grip or extra height through shoulder discomfort."},
 frontRaise:{f:["Light weight, raise to shoulder height.","No swing, controlled lowering.","Optional \u2014 your pressing already covers the front delts."],w:"Adding volume to a muscle that is already the most worked in your week."},
 landmine:{f:["One hand on the bar end, press up and slightly across.","Brace the midsection, no twisting.","Kinder on the shoulder than a strict overhead press."],w:"Rotating the torso to get the bar up."},

 ropePush:{f:["Elbows pinned, spread the rope at the bottom.","Full extension, slow return.","Lighter than the straight bar."],w:"Letting the elbows drift forward."},
 ohExt:{"f":["Face away from the cable with upper arms elevated in a comfortable position.","Bend and extend the elbows while keeping the trunk controlled.","Use a natural elbow width and a range that does not cause discomfort."],"w":"Turning the movement into a whole-body swing or forcing elbows tightly together."},
 skullCrush:{f:["EZ bar, lower to the forehead or just behind it.","Elbows stay pointing up.","Moderate weight \u2014 this is hard on the elbows."],w:"Letting the elbows drift back so it becomes a pullover."},

  var d=dObj(s),st=new Date(d);st.setDate(d.getDate()-d.getDay());

function reg(p){
  if(p.length<2)return null;
  var n=p.length,mx=0,my=0,i;
  for(i=0;i<n;i++){mx+=p[i].x;my+=p[i].y;}mx/=n;my/=n;
  var a=0,b=0;
  for(i=0;i<n;i++){a+=(p[i].x-mx)*(p[i].y-my);b+=Math.pow(p[i].x-mx,2);}

function history(id,days){var byDay={};S.sessions.forEach(function(s){var a=(s.ex||{})[id];if(!a)return;var g=ago(s.d);if(g<0||g>days)return;var valid=a.filter(function(x){return num(x.v)>0&&x.clean!==false;});if(!valid.length)return;var e=byDay[s.d]||(byDay[s.d]={d:s.d,g:g,v:0,kg:0,n:0,sets:[]});valid.forEach(function(x){e.v=Math.max(e.v,num(x.v));e.kg=Math.max(e.kg,num(x.kg)||0);e.sets.push(x);e.n++;});});return Object.keys(byDay).map(function(d){return byDay[d];}).sort(function(a,b){return a.g-b.g;});}

function suggest(id){var e=EX[id],h=history(id,42),r=planRange(id);if(!r||e.k==='mins'||e.unit)return null;
  var recent=h.slice(0,3),old=h.slice(2,5);if(h.length>=4){var now=Math.max.apply(null,h.slice(0,2).map(function(x){return x.v;})),before=Math.max.apply(null,old.map(function(x){return x.v;}));if(before>0&&now<before*.85)return {kind:'steady',head:'Keep the target steady',body:'Recent performance is down. Check technique, load changes and recovery before increasing the target.'};}
  if(FAMOF[id]){var f=FAM[FAMOF[id]],fr=famRank(FAMOF[id]),ci=clearInfo(id);if(ci){var previous=null;f.steps.forEach(function(st){if(st.id===id&&stepEvidence(st).confirmed)previous=st;});if(previous&&fr.next&&fr.next.id!==id&&stepEvidence(previous).dates.filter(function(d){return ago(d)<=42;}).length>=2)return {kind:'swap',head:'Explore '+EX[fr.next.id].n,body:'You repeated the milestone on two training days. Try short, controlled sets of the next variation when fresh. Keep easier work if the new shape is not yet consistent.',swap:fr.next.id};if(e.k!=='load')return null;}}
  if(h.length<2)return null;

  if(e.k==='load'){if(id==='assistPull'||id==='assistDip')return {kind:'steady',head:'Reduce assistance gradually',body:'The kg value is assistance: less assistance is harder. Keep the same machine and range, and lower assistance by its smallest step after every prescribed set reaches the top of the rep range on two training days.'};var target=num(planKg(id)),base=Number.isFinite(target)?target:Math.max.apply(null,recent.map(function(x){return x.kg;}));if(!(base>0))return null;if(recent.filter(function(x){return completedTarget(x,id,r.hi,base);}).length<2)return null;var inc=Math.min(loadStep(id),Math.max(.25,Math.round(base*.05*4)/4)),next=Math.round((base+inc)*100)/100,t=exTarget(id);return {kind:'load',head:'Try '+next+' kg',body:'Every prescribed set reached '+r.hi+' reps at '+base+' kg on two recent training days. Use the nearest available small increment and keep the range controlled.',newT:planKg(id)?t.replace(/(?:\+|·\s*)\d+(?:\.\d+)?\s*kg/,'· '+next+' kg'):t+' · '+next+' kg'};}
  if(recent.filter(function(x){return completedTarget(x,id,r.hi);}).length>=2){var t=exTarget(id),band=r.lo===r.hi?String(r.hi+1):(r.lo+1)+'–'+(r.hi+1);return {kind:'reps',head:'Build to '+band+' reps',body:'Every prescribed set reached the top of the range on two recent days. Add one rep per set, or keep the target and improve control.',newT:t.replace(/×\s*\d+(?:\.\d+)?(?:\s*[–-]\s*\d+(?:\.\d+)?)?/,'× '+band)};}return null;
}
function allSuggestions(type){

/* carbs are whatever is left once protein and fat are covered */
function carbTarget(){return Math.round((gKcal()-((gPLo()+gPHi())/2)*4-((FAT_LO+FAT_HI)/2)*9)/4/10)*10;}
function kcalFromMacros(n){
  if(!n||n.p==null||n.c==null||n.f==null)return null;
  return Math.round(n.p*4+n.c*4+n.f*9);
}
function nutOn(d){var r=null;S.nutrition.forEach(function(x){if(x.d===d)r=x;});return r;}
function nutAvg(days,f){
  var v=S.nutrition.filter(function(x){var g=ago(x.d);return g>=0&&g<days&&x[f]!=null;});
  return v.length?v.reduce(function(a,x){return a+x[f];},0)/v.length:null;
}
function nutRange(a,b,f){
  var v=S.nutrition.filter(function(x){return x.d>=a&&x.d<=b&&x[f]!=null;});
  return v.length?v.reduce(function(s,x){return s+x[f];},0)/v.length:null;
}
function setNut(d,kcal,pr,cb,ft){
  var prev=nutOn(d)||{};
  S.nutrition=S.nutrition.filter(function(x){return x.d!==d;});
  var o={d:d};
  [["kcal",kcal],["p",pr],["c",cb],["f",ft]].forEach(function(pair){
    var k=pair[0],v=pair[1];
    if(v!=null&&!isNaN(v))o[k]=Math.round(v);
    else if(prev[k]!=null)o[k]=prev[k];
  });
  if(o.kcal!=null||o.p!=null||o.c!=null||o.f!=null)S.nutrition.push(o);
  S.nutrition.sort(function(x,y){return x.d<y.d?-1:1;});
}
/* rough: a kilo of gained tissue treated as about 7700 kcal */
function intakeAdvice(){
  var r=rate(),k=nutAvg(10,"kcal");
  if(r===null||k===null)return null;
  return {rate:r,avg:Math.round(k),target:Math.round((k-(r-0.3)*1100)/10)*10};
}
/* values handed over by a Shortcut: ?kcal=2870&p=138&w=79.4&d=2026-08-11 */
function readParams(){
  if(typeof location==="undefined"||!location.search)return null;
  try{
    var q=new URLSearchParams(location.search),got=[];
    var d=q.get("d")||today();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=today();
    var kcal=parseFloat(q.get("kcal")),pr=parseFloat(q.get("p")),
        cb=parseFloat(q.get("c")),ft=parseFloat(q.get("f")),w=parseFloat(q.get("w"));
    if(!isNaN(kcal)||!isNaN(pr)||!isNaN(cb)||!isNaN(ft)){
      setNut(d,isNaN(kcal)?null:kcal,isNaN(pr)?null:pr,isNaN(cb)?null:cb,isNaN(ft)?null:ft);
      if(!isNaN(kcal))got.push(Math.round(kcal)+" kcal");
      var m=[];
      if(!isNaN(pr))m.push(Math.round(pr)+"P");
      if(!isNaN(cb))m.push(Math.round(cb)+"C");
      if(!isNaN(ft))m.push(Math.round(ft)+"F");
      if(m.length)got.push(m.join(" / ")+" g");
    }
    if(!isNaN(w)&&w>40&&w<200){
      S.weights=S.weights.filter(function(x){return x.d!==d;});
      S.weights.push({d:d,kg:w});
      S.weights.sort(function(x,y){return x.d<y.d?-1:1;});
      got.push(w.toFixed(1)+" kg");
    }
    if(got.length){
      saveState();
      if(typeof history!=="undefined"&&history.replaceState)history.replaceState(null,"",location.pathname);
      return "Logged "+got.join(", ")+(d===today()?"":" for "+fmtD(d));
    }
  }catch(e){}
  return null;
}

/* ============ trends ============ */
/* round numbers for an axis, never more than n of them */
function ticks(lo,hi,n){
  var span=hi-lo; if(span<=0)return [lo];
  var raw=span/n,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),step=mag;
  [1,2,2.5,5,10].some(function(m){ if(mag*m>=raw){step=mag*m;return true;} return false; });
  var out=[],v=Math.ceil(lo/step)*step;
  while(v<=hi+step*0.001){out.push(Math.round(v*100)/100);v+=step;}
  return out;
}
function grid(vals,Y,W,L,fmt){
  return vals.map(function(v){
    return '<line x1="'+L+'" x2="'+W+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+
      '" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="'+(L-7)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+fmt(v)+'</text>';
  }).join('');
}
function xlab(x,y,t,anchor){
  return '<text x="'+x.toFixed(1)+'" y="'+y+'" text-anchor="'+(anchor||"middle")+'" class="ax">'+t+'</text>';
}
function shortD(d){var p=d.split("-");return (+p[2])+" "+MON[+p[1]-1];}
function wChart(){
  var p=S.weights.filter(function(x){return ago(x.d)<=90;});
  if(p.length<2)return '<div class="card"><div class="empty">'+
    (p.length?'One weigh-in so far. Add another on a different day and the line starts.':'Log two morning weights and the trend line appears here.')+'</div></div>';
  var W=340,H=150,L=32,R=8,TOP=12,BOT=26;
  var xs=p.map(function(q){return -ago(q.d);});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs.concat([0]));
  var ys=p.map(function(q){return q.kg;});
  var y0=Math.min.apply(null,ys.concat([gTarget()]))-.5,y1=Math.max.apply(null,ys.concat([gTarget()]))+.5;
  var X=function(v){return L+((v-x0)/((x1-x0)||1))*(W-L-R);};
  var Y=function(v){return TOP+(1-(v-y0)/((y1-y0)||1))*(H-TOP-BOT);};
  var d="",dots="",hit="";
  p.forEach(function(q,i){
    var x=X(-ago(q.d)),y=Y(q.kg),sel=(pick&&pick.k==="w"&&pick.d===q.d);
    d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(sel?4.5:2.8)+'" fill="#2450FF"'+(sel?' stroke="#fff" stroke-width="2"':'')+'/>';
    hit+='<rect x="'+(x-13).toFixed(1)+'" y="0" width="26" height="'+H+'" fill="transparent" pointer-events="all" style="cursor:pointer" data-act="pt" data-k="w" data-d="'+q.d+'"/>';
  });
  var area="M"+X(x0).toFixed(1)+" "+(H-BOT)+" "+d.replace(/^M/,"L")+"L"+X(-ago(p[p.length-1].d)).toFixed(1)+" "+(H-BOT)+"Z";
  var g=grid(ticks(y0,y1,3),Y,W,L,function(v){return v.toFixed(1);});
  var xa=xlab(L,H-7,shortD(p[0].d),"start")+xlab(W-R,H-7,shortD(p[p.length-1].d),"end");
  var cal="";
  if(pick&&pick.k==="w"){
    var q2=null;p.forEach(function(z){if(z.d===pick.d)q2=z;});
    if(q2){

      cal='<line x1="'+px.toFixed(1)+'" x2="'+px.toFixed(1)+'" y1="'+TOP+'" y2="'+(H-BOT)+'" stroke="#2450FF" stroke-opacity=".3" stroke-width="1"/>'+
          '<text x="'+cx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" class="cal-t">'+q2.kg.toFixed(1)+' kg &#183; '+fmtD(q2.d)+'</text>';
    }
  }
  return '<div class="card pad chart"><svg viewBox="0 0 '+W+' '+H+'" style="height:150px">'+
    '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#2450FF" stop-opacity=".16"/><stop offset="1" stop-color="#2450FF" stop-opacity="0"/></linearGradient></defs>'+
    g+'<path d="'+area+'" fill="url(#wg)"/>'+
    '<line x1="'+L+'" x2="'+W+'" y1="'+Y(gTarget())+'" y2="'+Y(gTarget())+'" stroke="#1FA97F" stroke-width="1.4" stroke-dasharray="4 4"/>'+
    '<path d="'+d+'" fill="none" stroke="#2450FF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+(cal||xa)+hit+'</svg>'+
    '<div class="legend"><span><i class="sw" style="background:#2450FF"></i>Bodyweight</span>'+
    '<span><i class="sw" style="background:#1FA97F"></i>'+gTarget()+' kg goal</span>'+
    '<span style="color:var(--faint)">tap a point</span></div></div>';
}
function kChart(){
  var pts=S.nutrition.filter(function(x){return ago(x.d)<=30&&ago(x.d)>=0&&x.kcal!=null;});
  if(pts.length<3)return '<div class="card"><div class="empty">Log a few days of food and the pattern appears here.</div></div>';
  pts.sort(function(a,b){return a.d<b.d?-1:1;});
  var W=340,H=148,L=36,R=8,TOP=10,BOT=26,n=pts.length;
  var vals=pts.map(function(x){return x.kcal;});
  var y0=Math.min.apply(null,vals.concat([gKcal()]))*0.88,y1=Math.max.apply(null,vals.concat([gKcal()]))*1.04;
  var slot=(W-L-R)/Math.max(n,8),bw=Math.max(4,slot-4);
  var Y=function(v){return TOP+(1-(v-y0)/((y1-y0)||1))*(H-TOP-BOT);};
  var bars="",hit="";
  pts.forEach(function(x,i){
    var bx=L+i*slot,by=Y(x.kcal),sel=(pick&&pick.k==="k"&&pick.d===x.d);
    bars+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-BOT-by).toFixed(1)+
      '" rx="2.5" fill="'+(x.kcal>gKcal()+250?"#FF5F2E":"#2450FF")+'" opacity="'+(sel?1:.75)+'"/>';
    hit+='<rect x="'+bx.toFixed(1)+'" y="0" width="'+slot.toFixed(1)+'" height="'+H+
      '" fill="transparent" pointer-events="all" style="cursor:pointer" data-act="pt" data-k="k" data-d="'+x.d+'"/>';
  });
  var g=grid(ticks(y0,y1,3),Y,W,L,function(v){return Math.round(v);});
  var xa=xlab(L,H-7,shortD(pts[0].d),"start")+xlab(W-R,H-7,shortD(pts[n-1].d),"end");
  var cal="";
  if(pick&&pick.k==="k"){
    var q=null;pts.forEach(function(z){if(z.d===pick.d)q=z;});
    if(q){
      var i2=pts.indexOf(q),cx=Math.max(L+52,Math.min(W-52,L+i2*slot+bw/2));
      cal='<text x="'+cx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" class="cal-t">'+q.kcal+' kcal &#183; '+fmtD(q.d)+'</text>';
    }
  }
  return '<div class="card pad chart"><svg viewBox="0 0 '+W+' '+H+'" style="height:148px">'+
    g+bars+'<line x1="'+L+'" x2="'+W+'" y1="'+Y(gKcal())+'" y2="'+Y(gKcal())+'" stroke="#1FA97F" stroke-width="1.4" stroke-dasharray="4 4"/>'+
    (cal||xa)+hit+'</svg>'+
    '<div class="legend"><span><i class="sw" style="background:#2450FF"></i>Daily intake</span>'+
    '<span><i class="sw" style="background:#1FA97F"></i>'+gKcal()+' kcal goal</span>'+
    '<span style="color:var(--faint)">tap a bar</span></div></div>';

/* ============ weekly review ============ */
function weekBounds(w){
  var n=new Date();n.setHours(0,0,0,0);
  var end=new Date(n);end.setDate(n.getDate()-n.getDay()-7*w+6);
  var st=new Date(end);st.setDate(end.getDate()-6);
  return {a:iso(st),b:iso(end),
    lab:st.getDate()+" "+MON[st.getMonth()]+" – "+end.getDate()+" "+MON[end.getMonth()]};
}
function weekReview(w){
  var b=weekBounds(w);
  var ss=S.sessions.filter(function(s){return s.d>=b.a&&s.d<=b.b;});
  var ws=S.weights.filter(function(x){return x.d>=b.a&&x.d<=b.b;});
  var avg=ws.length?ws.reduce(function(a,x){return a+x.kg;},0)/ws.length:null;
  var prev=w<11?(function(){var p=weekBounds(w+1);
    var q=S.weights.filter(function(x){return x.d>=p.a&&x.d<=p.b;});
    return q.length?q.reduce(function(a,x){return a+x.kg;},0)/q.length:null;})():null;
  var holds={};
  ss.forEach(function(s){for(var k in (s.ex||{})){ if(!EX[k]||EX[k].k!=="hold")continue;
    var m=Math.max.apply(null,s.ex[k].map(function(x){return num(x.v)||0;}));
    if(m>(holds[k]||0))holds[k]=m;}});
  return {b:b,n:ss.length,avg:avg,delta:(avg!==null&&prev!==null)?avg-prev:null,holds:holds,
    kcal:nutRange(b.a,b.b,"kcal"),prot:nutRange(b.a,b.b,"p"),
    carb:nutRange(b.a,b.b,"c"),fat:nutRange(b.a,b.b,"f"),
    types:ss.map(function(s){return SESSIONS[s.type]?SESSIONS[s.type].name:s.type;})};
}
function reviewData(n){
  var out=[];
  for(var w=0;w<n;w++){var r=weekReview(w);if(r.n||r.avg!==null)out.push(r);}
  return out;
}

/* ============ timer ============ */
function stopTimer(){if(tId){clearInterval(tId);tId=null;}tRun=false;}
function tickDial(){
  if(!dial)return;
  var n=document.getElementById("dnum"),arc=document.getElementById("darc"),btn=document.getElementById("dbtn");
  if(!n||!arc){renderLayer();return;}
  var e=EX[dial],goal=(FAMOF[dial]&&clearInfo(dial)?clearInfo(dial).thr:e.goal)||30,C=2*Math.PI*104;
  var frac=tMode==="hold"?Math.min(1,tVal/goal):(restLen?tVal/restLen:0);
  arc.setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(1));
  if(tMode==="hold"){
    arc.classList.toggle("over",tVal>=goal);
    n.textContent=tVal.toFixed(1);
    if(btn)btn.textContent="Stop and log "+tVal.toFixed(1)+"s";
  }else{
    n.textContent=Math.floor(tVal/60)+":"+String(Math.floor(tVal%60)).padStart(2,"0");
  }
  if(!tRun)n.classList.remove("pulse");
}
function startHold(){stopTimer();tVal=0;tRun=true;renderLayer();
  var t0=Date.now();
  tId=setInterval(function(){tVal=Math.round((Date.now()-t0)/100)/10;tickDial();},100);}
function startRest(sec){stopTimer();restLen=sec;tVal=sec;tRun=true;renderLayer();
  var end=Date.now()+sec*1000;
  tId=setInterval(function(){
    tVal=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(tVal<=0){stopTimer();if(navigator.vibrate)navigator.vibrate([140,90,140]);}
    tickDial();},250);}

    stopTimer();var held=tVal;
    if(held>0){log[dial]=log[dial]||[];log[dial].push({v:String(Math.floor(held*10)/10),t:Date.now()});saveDraft();}
    dial=null;render();toast("Logged "+held.toFixed(1)+"s");
  }
  else if(a==="rest"){startRest(+attr(b,"s"));}
  else if(a==="close"||(a==="closebg"&&e.target.classList.contains("scrim"))){
    stopTimer();sheet=null;dial=null;info=null;pickFor=null;render();
  }
  else if(a==="filt"){
    var g=attr(b,"g"),v=attr(b,"v"),ix=pf[g].indexOf(v);
    if(ix>=0)pf[g].splice(ix,1);else pf[g].push(v);
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);enhanceControls(document.getElementById("pb"));
  }
  else if(a==="filtclear"){
    pf={m:[],q:[],e:[],k:[]};
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);enhanceControls(document.getElementById("pb"));
  }
  else if(a==="pick"){
    L=list(pickFor);var ix0=L.indexOf(id);
    if(ix0>=0){L.splice(ix0,1);delete log[id];}else L.push(id);
    setList(pickFor,L);saveDraft();
    document.getElementById("pb").innerHTML=pickList(document.getElementById("pq").value);enhanceControls(document.getElementById("pb"));
  }
  else if(a==="rmex"){L=list(ty);L.splice(L.indexOf(id),1);setList(ty,L);delete log[id];saveDraft();render();}
  else if(a==="up"||a==="down"){
    L=list(ty);var i=L.indexOf(id),j=a==="up"?i-1:i+1;
    if(j>=0&&j<L.length){var tmp=L[i];L[i]=L[j];L[j]=tmp;setList(ty,L);render();}
  }
  else if(a==="resetex"){delete S.templates[ty];saveState();loadLog();render();toast("Exercises reset to default");}
  else if(a==="savegoals"){
    var gv=function(id){var v=num(document.getElementById(id).value);return isNaN(v)?null:v;};
    var w=gv("gW"),k=gv("gK"),p1=gv("gP1"),p2=gv("gP2"),changed=0;
    if(w!==null){if(w<40||w>200){toast("Goal weight looks wrong");return;}S.goals.target=w;changed++;}
    if(k!==null){if(k<1200||k>6000){toast("Calorie target looks wrong");return;}S.goals.kcal=Math.round(k);changed++;}
    if(p1!==null){S.goals.plo=Math.round(p1);changed++;}
    if(p2!==null){S.goals.phi=Math.round(p2);changed++;}
    if(S.goals.plo&&S.goals.phi&&S.goals.plo>S.goals.phi){var t2=S.goals.plo;S.goals.plo=S.goals.phi;S.goals.phi=t2;}
    if(!changed){toast("Fill in at least one goal");return;}
    saveState();render();toast("Goals saved");
  }
  else if(a==="resetgoals"){S.goals={};saveState();render();toast("Goals back to default");}
  else if(a==="resetsched"){S.schedule={};saveState();viewType=null;loadLog();render();toast("Schedule reset to default");}
  else if(a==="applysug"){
    var sg=suggest(id);
    if(!sg||!sg.newT){toast("Nothing to apply");return;}
    S.targets[id]=sg.newT;saveState();render();toast(EX[id].n+" target is now "+sg.newT);
  }
  else if(a==="hidesug"){
    var sg2=suggest(id);
    if(sg2)S.hidden[id+"|"+sg2.kind]=sg2.head;
    saveState();render();toast("Put away until this changes");
  }
  else if(a==="applyswap"){
    var to=attr(b,"to"),ty3=curType(),L3=list(ty3),ix3=L3.indexOf(id);
    if(ix3<0){toast("That is not in this session");return;}
    if(L3.indexOf(to)>=0)L3.splice(ix3,1); else L3[ix3]=to;
    setList(ty3,L3);
    /* anything already logged today still saves — it was real work */
    info=null;sheet=null;render();
    toast(EX[to].n+" swapped into "+SESSIONS[ty3].name.toLowerCase());
  }
  else if(a==="resettargets"){S.targets={};saveState();render();toast("All targets back to the original plan");}
  else if(a==="copysum"){
    var sm=document.getElementById("sum");sm.select();sm.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("Summary copied");}catch(err){toast("Select the text and copy it");}
  }
  else if(a==="savefood"){
    var g=function(id){var v=num(document.getElementById(id).value);return isNaN(v)?null:v;};
    var kc=g("kIn"),pv=g("pIn"),cv=g("cIn"),fv=g("fIn");
    if(kc===null&&pv===null&&cv===null&&fv===null){toast("Fill in at least one figure");return;}
    setNut(selDate,kc,pv,cv,fv);
    saveState();render();toast("Food saved");
  }
  else if(a==="savew"){
    var v=num(document.getElementById("wIn").value);
    if(isNaN(v)||v<40||v>200){toast("Enter a weight in kilos");return;}
    S.weights=S.weights.filter(function(x){return x.d!==selDate;});
    S.weights.push({d:selDate,kg:v});
    S.weights.sort(function(x,y){return x.d<y.d?-1:1;});
    saveState();render();toast("Weight saved");
  }
  else if(a==="save"){
    var ex={},n=0;
    for(var checkId in log){var invalid=log[checkId].some(function(x){if(x.v==='')return false;var v=num(x.v),kg=num(x.kg),e=EX[checkId];return !Number.isFinite(v)||v<=0||((e.k==='load'||e.k==='reps')&&!e.unit&&v%1!==0)||(e.k==='load'&&(!Number.isFinite(kg)||kg<0));});if(invalid){toast('Check '+EX[checkId].n+': enter positive values, whole reps and a valid load.');return;}}
    for(var k in log){var c=log[k].filter(function(s){return num(s.v)>0&&Number.isFinite(num(s.v))&&(EX[k].k!=="load"||(num(s.kg)>=0&&Number.isFinite(num(s.kg))));});if(c.length){ex[k]=c;n++;}}
    if(!n){toast("Enter a completed set; weighted exercises also need a load");return;}
    if(ago(selDate)<0){toast("Future dates are for planning only");return;}
    var ty4=curType(),prev=savedFor(selDate,ty4);
    if(prev)prev.ex=ex; else S.sessions.push({id:Date.now(),d:selDate,type:ty4,ex:ex});
    S.draft=null;saveState();loadLog();render();
    toast(prev?"Session updated":"Session saved");
  }
  else if(a==="copy"){
    var io=document.getElementById("io");io.select();io.setSelectionRange(0,999999);
    try{document.execCommand("copy");toast("Backup copied");}catch(err){toast("Select the text and copy it");}
  }
  else if(a==="restore"){
    var io2=document.getElementById("io");io2.readOnly=false;
    try{var p=JSON.parse(io2.value);
      var restored=stateFromBackup(p);
      try{localStorage.setItem(STORE+'.beforeRestore',JSON.stringify(S));}catch(err){toast('Could not back up current data. Restore cancelled.');return;}
      S=restored;
      saveState();viewType=null;loadLog();render();toast("Restored");
    }catch(err){toast("Backup is invalid. Your current data has not changed.");}
  }
});

  var ic="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%23285C45'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='42' stroke-linecap='round'%3E%3Cpath d='M313 159 A97 97 0 1 0 313 353'/%3E%3Cpath d='M233 256 H395'/%3E%3C/g%3E%3C/svg%3E";
  var mf={name:"Calisthenics",short_name:"Calisthenics",start_url:".",display:"standalone",
    background_color:"#F5F5F0",theme_color:"#F5F5F0",
    icons:[{src:ic,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};

loadState();
selDate=today();calMonth=today();
var handoff=readParams();
loadLog();
render();
if(handoff)toast(handoff);
</script>
